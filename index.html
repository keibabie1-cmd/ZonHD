<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZonHD Cinema</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --gold: #D4AF37; --red: #FF0000; --black: #050505; }
        body { background: var(--black); color: white; font-family: 'Playfair Display', serif; }
        
        /* Majestic Header with Black Woman Medusa */
        .hero-banner {
            height: 70vh;
            background: linear-gradient(to bottom, transparent 60%, var(--black) 100%), 
                        url('https://api.deepai.org/job-view-file/45c7546a-723a-4416-8c01-831495c0c97e/outputs/output.jpg'); /* This is a placeholder; upload your preferred Medusa image to GitHub and use that link */
            background-size: cover; background-position: center;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
            padding-bottom: 40px; border-bottom: 2px solid var(--gold);
        }

        .zonhd-logo {
            font-size: 5rem; font-weight: 900; color: var(--red);
            text-shadow: 0 0 20px var(--red), 0 0 40px var(--gold);
            letter-spacing: -2px; font-style: italic;
        }

        /* Torrent Card Styling */
        .movie-card {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(212, 175, 55, 0.1);
        }
        .movie-card:hover { transform: scale(1.08); border-color: var(--gold); box-shadow: 0 0 20px rgba(212, 175, 55, 0.3); }

        /* Cinema Mode Player */
        #player-overlay { display: none; background: #000; z-index: 1000; position: fixed; inset: 0; }
        .play-btn { background: url('https://cdn-icons-png.flaticon.com/512/727/727245.png'); background-size: contain; }
    </style>
</head>
<body>

    <div id="side-menu" class="fixed inset-y-0 left-0 w-72 bg-black/95 z-[200] -translate-x-full border-r border-gold/30 p-8 transition-transform">
        <h2 class="text-gold text-2xl font-bold mb-8">Studios</h2>
        <div class="flex flex-col gap-6 text-sm uppercase tracking-widest text-zinc-400">
            <button onclick="loadNetwork(213)">Netflix</button>
            <button onclick="loadNetwork(2739)">Disney+</button>
            <button onclick="loadNetwork(1024)">Prime Video</button>
            <button onclick="loadNetwork(43)">HBO</button>
            <button onclick="loadNetwork(67)">Paramount+</button>
            <button onclick="loadNetwork(49)">HBO</button>
        </div>
    </div>

    <header class="hero-banner">
        <h1 class="zonhd-logo">ZonHD</h1>
        <p class="text-gold tracking-[1em] text-[10px] uppercase font-bold">Cinema Medusa</p>
    </header>

    <nav class="sticky top-0 z-[100] bg-black/90 backdrop-blur-md p-4 flex overflow-x-auto gap-6 no-scrollbar border-b border-zinc-800">
        <button onclick="toggleMenu()" class="text-gold pr-4">☰</button>
        <button onclick="setGenre(28)">Action</button>
        <button onclick="setGenre(27)">Horror</button>
        <button onclick="setGenre(35)">Comedy</button>
        <button onclick="setGenre(16)">Anime</button>
        <button onclick="setGenre(10751)">Family</button>
    </nav>

    <main id="movie-grid" class="p-4 grid grid-cols-2 md:grid-cols-5 gap-6">
        </main>

    <div id="player-overlay">
        <button onclick="closePlayer()" class="absolute top-8 right-8 z-[1100] text-white bg-red-600 px-4 py-2 rounded-full">CLOSE</button>
        <iframe id="video-frame" allow="autoplay; fullscreen" allowfullscreen src=""></iframe>
    </div>

    <script>
        const API_KEY = 'b9c746781e1e9b084c4cc4f0420156d4';
        let page = 1;
        let currentPath = `trending/all/week`;

        async function fetchContent(append = false) {
            const res = await fetch(`https://api.themoviedb.org/3/${currentPath}?api_key=${API_KEY}&page=${page}`);
            const data = await res.json();
            const grid = document.getElementById('movie-grid');
            if(!append) grid.innerHTML = '';

            data.results.forEach(m => {
                const card = document.createElement('div');
                card.className = "movie-card bg-zinc-900 rounded-xl overflow-hidden relative group";
                card.onclick = () => openPlayer(m.id, m.media_type || 'movie');
                card.innerHTML = `<img src="https://image.tmdb.org/t/p/w500${m.poster_path}" class="w-full">
                                  <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity">
                                      <div class="w-16 h-16 play-btn"></div>
                                  </div>`;
                grid.appendChild(card);
            });
        }

        function openPlayer(id, type) {
            const overlay = document.getElementById('player-overlay');
            const iframe = document.getElementById('video-frame');
            // Torrent-only streaming bridge
            iframe.src = `https://vidsrc.me/embed/${type}?tmdb=${id}&autoplay=1`;
            overlay.style.display = 'block';
        }

        function closePlayer() {
            document.getElementById('player-overlay').style.display = 'none';
            document.getElementById('video-frame').src = '';
        }

        // Infinite Scroll Logic
        window.onscroll = () => {
            if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 1000) {
                page++;
                fetchContent(true);
            }
        };

        function toggleMenu() {
            const m = document.getElementById('side-menu');
            m.style.transform = m.style.transform === 'translateX(0px)' ? 'translateX(-100%)' : 'translateX(0px)';
        }

        fetchContent();
    </script>
</body>
</html>
