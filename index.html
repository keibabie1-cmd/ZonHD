<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ZonHD Cinema Luxe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,900;1,900&family=Inter:wght@300;400;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #D4AF37; --red: #E50914; --black: #050505; }
        body { background: var(--black); color: white; font-family: 'Inter', sans-serif; margin: 0; padding: 0; overflow-x: hidden; }
        
        #loader { position: fixed; inset: 0; background: var(--black); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .loader-medusa { width: 120px; height: 120px; border-radius: 50%; background: url('IMG_8035.jpeg'); background-size: cover; border: 3px solid var(--gold); box-shadow: 0 0 40px var(--red); animation: pulse 2s infinite ease-in-out; }
        @keyframes pulse { 0%, 100% { transform: scale(0.95); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 1; } }

        #side-menu { position: fixed; top: 0; left: 0; bottom: 0; width: 280px; background: #000; border-right: 1px solid var(--gold); z-index: 3000; transform: translateX(-100%); transition: 0.4s ease; }
        .menu-open { transform: translateX(0) !important; }

        .hero-banner { height: 50vh; position: relative; background: linear-gradient(to bottom, transparent, var(--black)), url('IMG_8035.jpeg'); background-size: cover; background-position: center; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 20px; }
        .zonhd-logo { font-family: 'Playfair Display', serif; font-size: clamp(3rem, 10vw, 5rem); color: var(--gold); text-shadow: 0 0 20px var(--red); font-style: italic; }
        
        .movie-card { aspect-ratio: 2/3; border-radius: 8px; overflow: hidden; cursor: pointer; transition: 0.3s; border: 3px solid transparent; background: #111; }
        .focusable:focus { outline: none; border: 3px solid var(--gold) !important; transform: scale(1.05); box-shadow: 0 0 25px rgba(212, 175, 55, 0.4); z-index: 50; }

        #selector-overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 4500; overflow-y: auto; }
        #details-backdrop { position: absolute; top: 0; width: 100%; height: 100%; opacity: 0.3; background-size: cover; background-position: center; filter: blur(40px); pointer-events: none; }
        
        .btn-play-red { background: var(--red); color: white; font-weight: 700; padding: 14px; border-radius: 8px; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; max-width: 400px; margin: 15px 0; transition: 0.2s; }
        
        /* PLAYER STYLES */
        #player-overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 5000; transform: translateZ(0); }
        .player-loader { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #000; z-index: 5001; transition: opacity 0.5s; }
        .loading-ring { width: 60px; height: 60px; border: 3px solid rgba(212, 175, 55, 0.1); border-top: 3px solid var(--gold); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        #luxe-player { width: 100%; height: 100%; border: none; opacity: 0; transition: opacity 1s; }
        #luxe-player.ready { opacity: 1; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="loader"><div class="loader-medusa"></div><p class="text-gold mt-6 tracking-[0.5em] font-bold uppercase">ZonHD Cinema</p></div>

    <div id="side-menu" class="p-8 no-scrollbar overflow-y-auto">
        <h2 class="text-gold font-bold mb-8 italic border-b border-red-900 pb-2 uppercase tracking-tighter">Networks</h2>
        <div id="nav-networks" class="flex flex-col gap-6 text-zinc-400 font-bold uppercase text-xs tracking-widest">
            <button class="focusable text-left" onclick="setFilter('network', 213)">Netflix</button>
            <button class="focusable text-left" onclick="setFilter('network', 453)">Hulu</button>
            <button class="focusable text-left" onclick="setFilter('network', 2739)">Disney+</button>
            <button class="focusable text-left" onclick="setFilter('network', 19)">Nickelodeon</button>
            <button class="focusable text-left" onclick="setFilter('network', 56)">Cartoon Network</button>
        </div>
    </div>

    <header class="hero-banner"><h1 class="zonhd-logo">ZonHD</h1><p class="text-gold tracking-[0.8em] text-[10px] font-bold uppercase">Cinema Luxe</p></header>

    <div class="sticky top-0 z-[1000] bg-black/95 border-b border-zinc-900">
        <input type="text" id="search-input" class="focusable w-[90%] mx-auto block bg-white/5 border border-gold/20 rounded-full py-2 px-6 my-4 text-white outline-none" placeholder="Search Master Library..." onkeyup="handleSearch(event)">
        <nav class="flex p-4 gap-8 overflow-x-auto no-scrollbar items-center px-6 text-[10px] font-bold tracking-widest uppercase">
            <button onclick="toggleMenu()" class="focusable text-gold text-2xl pr-2">☰</button>
            <button id="btn-trending" onclick="setFilter('trending')" class="focusable whitespace-nowrap">Trending</button>
            <button class="focusable whitespace-nowrap" onclick="setFilter('genre', 27)">Horror</button>
            <button class="focusable whitespace-nowrap" onclick="setFilter('genre', 28)">Action</button>
            <button class="focusable whitespace-nowrap" onclick="setFilter('genre', 16)">Anime</button>
        </nav>
    </div>

    <main id="movie-grid" class="p-4 grid grid-cols-2 md:grid-cols-5 gap-4"></main>

    <div id="selector-overlay" class="no-scrollbar">
        <div id="details-backdrop"></div>
        <div class="relative z-10 p-6 pt-10 max-w-4xl mx-auto">
            <button onclick="closeSelector()" class="focusable mb-6 bg-black/50 p-2 rounded-full border border-white/10">
                <svg width="24" height="24" fill="white" viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
            </button>
            <div class="flex gap-5 mb-6">
                <img id="details-poster" class="w-32 rounded-lg shadow-2xl border border-white/10">
                <div class="flex flex-col justify-end">
                    <h2 id="show-title" class="text-3xl font-extrabold mb-2 tracking-tighter"></h2>
                    <div class="flex items-center gap-3">
                        <span id="show-year" class="text-zinc-400 text-sm font-bold"></span>
                        <span id="show-rating" class="border border-gold text-gold px-2 py-0.5 rounded text-xs"></span>
                    </div>
                </div>
            </div>
            <button id="main-play-btn" onmouseenter="preConnect()" onclick="startLuxeStream()" class="focusable btn-play-red">▶ Play Now</button>
            <p id="show-desc" class="text-zinc-400 text-sm leading-relaxed mb-8 mt-4"></p>
            <div id="tv-action-area" class="hidden">
                <div id="season-buttons" class="flex gap-3 overflow-x-auto no-scrollbar mb-6"></div>
                <div id="episode-grid" class="flex flex-col"></div>
            </div>
        </div>
    </div>

    <div id="player-overlay">
        <div id="p-loader" class="player-loader">
            <div class="loading-ring"></div>
            <p class="text-gold mt-4 font-bold tracking-widest text-[10px] uppercase">Decrypting Stream...</p>
        </div>
        <button onclick="closePlayer()" class="focusable absolute top-6 left-6 z-[7000] bg-black/60 text-white px-4 py-2 rounded-full border border-white/20 font-bold text-xs">✕ CLOSE</button>
        <iframe id="luxe-player" allowfullscreen sandbox="allow-forms allow-pointer-lock allow-same-origin allow-scripts"></iframe>
    </div>

    <script>
        let API_KEY = '', currentMedia = {};

        async function fetchConfig() {
            try {
                const res = await fetch('/api/config');
                const data = await res.json();
                API_KEY = data.tmdb_key;
                fetchContent();
            } catch (err) { console.error("Key Error", err); }
        }

        async function fetchContent() {
            const url = `https://api.themoviedb.org/3/trending/all/day?api_key=${API_KEY}`;
            const res = await fetch(url);
            const data = await res.json();
            renderGrid(data.results);
        }

        function renderGrid(results) {
            const grid = document.getElementById('movie-grid');
            grid.innerHTML = '';
            results.forEach(m => {
                if (!m.poster_path) return;
                const card = document.createElement('div');
                card.className = "movie-card focusable"; card.tabIndex = 0;
                card.onclick = () => openDetails(m.id, m.media_type || (m.first_air_date ? 'tv' : 'movie'));
                card.innerHTML = `<img src="https://image.tmdb.org/t/p/w500${m.poster_path}" class="w-full h-full object-cover">`;
                grid.appendChild(card);
            });
        }

        async function openDetails(id, type) {
            const res = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}`);
            const data = await res.json();
            currentMedia = { id, type, s: 1, e: 1, title: data.name || data.title, poster: data.poster_path };
            
            document.getElementById('show-title').innerText = currentMedia.title;
            document.getElementById('show-desc').innerText = data.overview;
            document.getElementById('show-year').innerText = (data.release_date || data.first_air_date || '').split('-')[0];
            document.getElementById('show-rating').innerText = `★ ${data.vote_average.toFixed(1)}`;
            document.getElementById('details-poster').src = `https://image.tmdb.org/t/p/w500${data.poster_path}`;
            document.getElementById('details-backdrop').style.backgroundImage = `url(https://image.tmdb.org/t/p/original${data.backdrop_path})`;
            
            document.getElementById('tv-action-area').classList.toggle('hidden', type !== 'tv');
            document.getElementById('selector-overlay').style.display = 'block';
        }

        // DNS Pre-connect: Buffering starts here (quietly)
        function preConnect() {
            const link = document.createElement('link');
            link.rel = 'preconnect';
            link.href = 'https://vidsrc.me';
            document.head.appendChild(link);
        }

        function startLuxeStream() {
            const { type, id, s, e } = currentMedia;
            const iframe = document.getElementById('luxe-player');
            const loader = document.getElementById('p-loader');
            
            // Cleanest mirror currently available
            const url = type === 'movie' 
                ? `https://vidsrc.me/embed/movie?tmdb=${id}` 
                : `https://vidsrc.me/embed/tv?tmdb=${id}&sea=${s}&number=${e}`;

            loader.style.opacity = '1';
            iframe.classList.remove('ready');
            iframe.src = url;
            document.getElementById('player-overlay').style.display = 'block';

            iframe.onload = () => {
                setTimeout(() => {
                    loader.style.opacity = '0';
                    iframe.classList.add('ready');
                }, 1000); // Small buffer to ensure video engine starts
            };
        }

        function closePlayer() {
            const iframe = document.getElementById('luxe-player');
            iframe.src = "";
            document.getElementById('player-overlay').style.display = 'none';
        }

        function closeSelector() { document.getElementById('selector-overlay').style.display = 'none'; }
        function toggleMenu() { document.getElementById('side-menu').classList.toggle('menu-open'); }

        window.onload = () => { 
            setTimeout(() => document.getElementById('loader').remove(), 1000); 
            fetchConfig(); 
        };
    </script>
</body>
</html>
