<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZonHD Cinema</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050505; color: white; font-family: sans-serif; }
        .medusa-glow { text-shadow: 0 0 20px #ff0000, 0 0 30px #ff0000; }
    </style>
</head>
<body>
    <div class="p-8 text-center">
        <h1 class="text-6xl font-bold text-red-600 medusa-glow mb-4">ZonHD</h1>
        <p class="text-gray-400 tracking-widest uppercase text-xs">Premium Streaming Experience</p>
    </div>

    <div class="max-w-7xl mx-auto p-6 grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-6" id="movie-grid">
        <div id="status" class="text-center p-20 col-span-full">
            <div class="animate-spin inline-block w-10 h-10 border-4 border-red-600 border-t-transparent rounded-full"></div>
            <p class="mt-4 text-red-500 font-bold">Waking the Medusa...</p>
        </div>
    </div>

    <script>
        const API_KEY = 'b9c746781e1e9b084c4cc4f0420156d4'; 
        const grid = document.getElementById('movie-grid');
        const status = document.getElementById('status');

        async function loadMovies() {
            try {
                const response = await fetch(`https://api.themoviedb.org/3/movie/popular?api_key=${API_KEY}&language=en-US&page=1`);
                const data = await response.json();

                if (data.results && data.results.length > 0) {
                    grid.innerHTML = ''; // Clear spinner
                    data.results.forEach(movie => {
                        const card = document.createElement('div');
                        card.className = "bg-zinc-900 rounded-lg overflow-hidden border border-zinc-800 shadow-2xl";
                        card.innerHTML = `
                            <img src="https://image.tmdb.org/t/p/w500${movie.poster_path}" class="w-full">
                            <div class="p-3 text-sm font-bold truncate">${movie.title}</div>
                        `;
                        grid.appendChild(card);
                    });
                } else {
                    status.innerHTML = '<p class="text-red-500">No movies found. Check API key status.</p>';
                }
            } catch (err) {
                status.innerHTML = '<p class="text-red-500">Connection Interrupted. Try refreshing.</p>';
            }
        }
        loadMovies();
    </script>
</body>
</html>
