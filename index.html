<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ZonHD Cinema Luxe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,900;1,900&family=Inter:wght@300;400;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #D4AF37; --red: #E50914; --black: #050505; }
        body { background: var(--black); color: white; font-family: 'Inter', sans-serif; margin: 0; padding: 0; overflow-x: hidden; touch-action: pan-y; }
        #loader { position: fixed; inset: 0; background: var(--black); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s ease; }
        .loader-medusa { width: 120px; height: 120px; border-radius: 50%; background: url('IMG_8035.jpeg'); background-size: cover; border: 3px solid var(--gold); box-shadow: 0 0 40px var(--red); animation: pulse 2s infinite ease-in-out; }
        @keyframes pulse { 0%, 100% { transform: scale(0.95); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 1; } }
        #side-menu { position: fixed; top: 0; left: 0; bottom: 0; width: 280px; background: #000; border-right: 1px solid var(--gold); z-index: 3000; transform: translateX(-100%); transition: 0.4s ease; }
        .menu-open { transform: translateX(0) !important; }
        .hero-banner { height: 50vh; position: relative; background: linear-gradient(to bottom, transparent, var(--black)), url('IMG_8035.jpeg'); background-size: cover; background-position: center; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 20px; }
        .zonhd-logo { font-family: 'Playfair Display', serif; font-size: clamp(3rem, 10vw, 5rem); color: var(--gold); text-shadow: 0 0 20px var(--red); font-style: italic; }
        .movie-card { aspect-ratio: 2/3; border-radius: 8px; overflow: hidden; cursor: pointer; transition: 0.3s; border: 3px solid transparent; position: relative; }
        .focusable:focus { outline: none; border-color: var(--gold) !important; transform: scale(1.08); box-shadow: 0 0 25px rgba(212, 175, 55, 0.6); z-index: 50; }
        #selector-overlay { display: none; width: 100%; min-height: 100vh; background: var(--black); position: relative; z-index: 4000; }
        #details-backdrop { position: absolute; top: 0; right: 0; width: 100%; height: 450px; background-size: cover; background-position: top right; opacity: 0.75; pointer-events: none; mask-image: linear-gradient(to bottom, black 40%, transparent 100%); -webkit-mask-image: linear-gradient(to bottom, black 40%, transparent 100%); }
        .rating-badge { border: 1.5px solid var(--gold); color: var(--gold); padding: 1px 6px; border-radius: 4px; font-weight: 800; font-size: 13px; }
        .tv-tag { background: #331a1a; color: #ff4d4d; padding: 1px 6px; border-radius: 4px; font-size: 11px; font-weight: 800; }
        .btn-play-red { background: var(--red); color: white; font-weight: 700; padding: 14px; border-radius: 8px; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; max-width: 400px; margin: 15px 0; border: 3px solid transparent; }
        .episode-row { display: flex; gap: 15px; padding: 15px 0; border-bottom: 1px solid #222; cursor: pointer; border: 3px solid transparent; }
        .ep-thumbnail { width: 120px; aspect-ratio: 16/9; background-size: cover; border-radius: 4px; flex-shrink: 0; position: relative; }
        .ep-play-btn { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.2); }
        #player-overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 5000; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .active-filter { color: var(--gold) !important; border-bottom: 2px solid var(--gold); }
        .origin-badge { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.7); color: var(--gold); font-size: 8px; text-align: center; padding: 2px; font-weight: 900; letter-spacing: 1px; }
        /* Play button overlay */
        #spoof-play-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.7);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255,255,255,0.3);
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            pointer-events: auto;
        }
        #spoof-play-btn::after {
            content: '';
            width: 0;
            height: 0;
            border-left: 30px solid white;
            border-top: 18px solid transparent;
            border-bottom: 18px solid transparent;
            margin-left: 8px;
        }
        #spoof-play-btn:active {
            transform: translate(-50%, -50%) scale(0.9);
        }
    </style>
</head>
<body>
    <div id="loader"><div class="loader-medusa"></div><p class="text-gold mt-6 tracking-[0.5em] font-bold uppercase">ZonHD Cinema</p></div>

    <div id="side-menu" class="p-8 no-scrollbar overflow-y-auto">
        <h2 class="text-gold font-bold mb-4 italic border-b border-red-900 pb-2 uppercase tracking-tighter">Luxe Vaults</h2>
        <div class="flex flex-col gap-4 mb-10 text-zinc-400 font-bold uppercase text-[10px] tracking-widest">
            <button class="focusable text-left py-2 hover:text-white" onclick="setFilter('list', '8661848')">African American Vault</button>
            <button class="focusable text-left py-2 hover:text-white" onclick="setFilter('list', '8662163')">Wrestling</button>
            <button class="focusable text-left py-2 hover:text-white" onclick="setFilter('network', '34')">Lifetime & LMN</button>
            <button class="focusable text-left py-2 hover:text-white" onclick="setFilter('kdrama')">K-Drama</button>
        </div>

        <h2 class="text-gold font-bold mb-8 italic border-b border-red-900 pb-2 uppercase tracking-tighter">Networks</h2>
        <div id="nav-networks" class="flex flex-col gap-6 text-zinc-400 font-bold uppercase text-xs tracking-widest">
            <button class="focusable" onclick="setFilter('network', 213)">Netflix</button>
            <button class="focusable" onclick="setFilter('network', 453)">Hulu</button>
            <button class="focusable" onclick="setFilter('network', 2739)">Disney+</button>
            <button class="focusable" onclick="setFilter('network', 19)">Nickelodeon</button>
            <button class="focusable" onclick="setFilter('network', 243)">Boomerang</button>
            <button class="focusable" onclick="setFilter('network', 34)">Adult Swim</button>
            <button class="focusable" onclick="setFilter('network', 56)">Cartoon Network</button>
            <button class="focusable" onclick="setFilter('network', 77)">SyFy</button>
        </div>

        <h2 class="text-gold font-bold mt-10 mb-4 italic border-b border-red-900 pb-2 uppercase tracking-tighter">Support</h2>
        <a href="https://buymeacoffee.com/ZonHD" target="_blank" class="focusable flex items-center justify-center gap-2 bg-gold text-black font-black px-4 py-3 rounded-lg text-xs uppercase tracking-widest w-full hover:bg-yellow-600 transition">
            ☕ Buy Me a Coffee
        </a>
    </div>

    <div id="main-app-wrapper">
        <header class="hero-banner"><h1 class="zonhd-logo">ZonHD</h1><p class="text-gold tracking-[0.8em] text-[10px] font-bold uppercase">Cinema Luxe</p></header>

        <div class="sticky top-0 z-[1000] bg-black/95 border-b border-zinc-900">
            <div class="flex items-center w-[95%] mx-auto gap-2 py-4">
                <input type="search" id="search-input" 
                        class="focusable flex-1 bg-white/5 border border-gold/20 rounded-full py-2 px-6 text-white outline-none" 
                        placeholder="Search Master Library..." 
                        enterkeyhint="search"
                        onsearch="triggerSearch()"
                        onkeyup="handleSearch(event)">
                <button onclick="triggerSearch()" tabindex="0" class="focusable bg-gold text-black font-black px-4 py-2 rounded-full text-[10px] uppercase">Search</button>
            </div>
            <nav id="nav-main" class="flex p-4 gap-8 overflow-x-auto no-scrollbar items-center justify-start px-6 text-[10px] font-bold tracking-widest uppercase">
                <button id="menu-btn" onclick="toggleMenu()" class="focusable text-gold text-2xl pr-2">☰</button>
                <button id="btn-trending" onclick="setFilter('trending')" class="focusable active-filter whitespace-nowrap">Trending</button>
                <button class="focusable" onclick="setFilter('genre', 27)" class="whitespace-nowrap">Horror</button>
                <button class="focusable" onclick="setFilter('genre', 28)" class="whitespace-nowrap">Action</button>
                <button class="focusable" onclick="setFilter('genre', 53)" class="whitespace-nowrap">Thriller</button>
                <button class="focusable" onclick="setFilter('genre', 10751)" class="whitespace-nowrap">Family</button>
                <button class="focusable" onclick="setFilter('anime')" class="whitespace-nowrap">Anime</button>
            </nav>
        </div>

        <section id="continue-section" class="hidden px-4 pt-6">
            <h3 class="text-gold font-bold uppercase tracking-widest text-xs mb-4">Continue Watching</h3>
            <div id="continue-grid" class="flex gap-4 overflow-x-auto no-scrollbar pb-4"></div>
        </section>

        <main id="movie-grid" class="p-4 grid grid-cols-2 md:grid-cols-5 gap-4"></main>
    </div>

    <div id="selector-overlay" class="no-scrollbar">
        <div id="details-backdrop"></div>
        <div class="relative z-10 p-6 pt-10 max-w-4xl mx-auto">
            <button id="close-sel-btn" onclick="closeSelector()" class="focusable mb-6 bg-black/50 p-2 rounded-full border border-white/10">
                <svg width="24" height="24" fill="white" viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
            </button>
            <div class="flex gap-5 mb-6">
                <img id="details-poster" class="w-32 rounded-lg shadow-2xl">
                <div class="flex flex-col justify-end">
                    <h2 id="show-title" class="text-3xl font-extrabold mb-2 tracking-tighter"></h2>
                    <div class="flex items-center gap-3">
                        <span id="show-year" class="text-zinc-400 text-sm font-bold"></span>
                        <span id="show-rating" class="rating-badge"></span>
                        <span id="media-type-tag" class="tv-tag">TV</span>
                    </div>
                </div>
            </div>
            <div id="movie-action-area" class="hidden"><button id="play-movie-btn" onclick="startLuxeStream()" class="focusable btn-play-red">▶ Play Now</button></div>
            <div id="tv-action-area-top" class="hidden"><button id="main-tv-btn" onclick="playCurrentEpisode()" class="focusable btn-play-red">▶ Play S1 E1</button></div>
            <p id="show-desc" class="text-zinc-400 text-sm leading-relaxed mb-8"></p>
            <div id="tv-action-area" class="hidden">
                <h3 class="text-lg font-bold mb-4 border-b border-zinc-800 pb-2">Episodes</h3>
                <div id="season-buttons" class="flex gap-3 overflow-x-auto no-scrollbar mb-6"></div>
                <div id="episode-grid" class="flex flex-col"></div>
            </div>
        </div>
    </div>

    <div id="player-overlay">
        <div class="absolute top-6 left-6 right-6 flex justify-between items-center z-[7000]">
            <div class="bg-gold/20 text-gold px-4 py-2 rounded-full border border-gold/40 font-bold text-[10px] tracking-widest uppercase">Cinema Luxe Player</div>
            <button id="close-player-btn" onclick="closePlayer()" class="focusable bg-black/60 text-white px-4 py-2 rounded-full border border-white/20 font-bold text-xs">✕ CLOSE</button>
        </div>
        <div id="iframe-container" class="w-full h-full" style="position:relative;"></div>
    </div>

    <script>
        function startLuxeStream() {
            saveToHistory(currentMedia.id, currentMedia.type, currentMedia.s, currentMedia.e, currentMedia.title, currentMedia.poster); 
            document.getElementById('player-overlay').style.display = 'block';
            loadPlayerFinal();
        }

        // ============================================================
        // PLAYER: vidsrc.pm direct with click shield + parent guards
        // ============================================================
        function loadPlayerFinal() {
            const { type, id, s, e, isAnime, title } = currentMedia;
            const container = document.getElementById('iframe-container');
            container.innerHTML = '';

            // 1. Parent guards (block popups & redirects)
            const originalOpen = window.open;
            let guardActive = true;
            window.open = function(url, target, features) {
                if (guardActive) {
                    console.log('[Guard] Blocked popup:', url);
                    return null;
                }
                return originalOpen.call(this, url, target, features);
            };
            const beforeUnloadHandler = function(e) {
                if (guardActive) {
                    e.preventDefault();
                    e.returnValue = '';
                    return '';
                }
            };
            window.addEventListener('beforeunload', beforeUnloadHandler);
            setTimeout(() => {
                guardActive = false;
                window.open = originalOpen;
                window.removeEventListener('beforeunload', beforeUnloadHandler);
            }, 8000);

            // 2. Build iframe (vidsrc.pm)
            let url;
            if (isAnime) {
                // For anime, use vidsrc.pm with the title (search might be needed) – but we'll use the same TV/movie logic.
                // vidsrc.pm expects TMDB ID. We'll rely on the ID from TMDB.
                url = (type === 'movie')
                    ? `https://vidsrc.pm/embed/movie/${id}`
                    : `https://vidsrc.pm/embed/tv/${id}/${s}/${e}`;
            } else {
                url = (type === 'movie')
                    ? `https://vidsrc.pm/embed/movie/${id}`
                    : `https://vidsrc.pm/embed/tv/${id}/${s}/${e}`;
            }

            const frame = document.createElement('iframe');
            frame.className = "w-full h-full";
            frame.style.border = "none";
            frame.id = "main-player-frame";
            frame.setAttribute('allow', 'accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; fullscreen');
            frame.setAttribute('allowfullscreen', 'true');
            // NO sandbox – let it run freely
            frame.src = url;
            container.appendChild(frame);

            // 3. Visible spoof play button (over the iframe's play button)
            const spoofBtn = document.createElement('div');
            spoofBtn.id = "spoof-play-btn";
            // Style already defined in CSS
            // On tap/click, remove the spoof button and block the event from reaching the iframe
            const spoofHandler = function(e) {
                e.preventDefault();
                e.stopPropagation();
                console.log('[Spoof] Play button tapped – removing overlay.');
                if (spoofBtn.parentNode) {
                    spoofBtn.parentNode.removeChild(spoofBtn);
                }
                // Also ensure that any subsequent events from this interaction are blocked
                return false;
            };
            // Attach to both click and touchstart (with capture)
            spoofBtn.addEventListener('click', spoofHandler, true);
            spoofBtn.addEventListener('touchstart', spoofHandler, { passive: false, capture: true });
            // Also block mousedown and mouseup to be safe
            spoofBtn.addEventListener('mousedown', spoofHandler, true);
            spoofBtn.addEventListener('mouseup', spoofHandler, true);

            container.style.position = "relative";
            container.appendChild(spoofBtn);

            // Auto‑remove after 5 seconds (in case user doesn't tap)
            setTimeout(() => {
                const existing = document.getElementById('spoof-play-btn');
                if (existing && existing.parentNode) {
                    existing.parentNode.removeChild(existing);
                }
            }, 5000);
        }
        // ============================================================

        function closePlayer() {
            document.getElementById('iframe-container').innerHTML = '';
            document.getElementById('player-overlay').style.display = 'none';
            document.getElementById('close-sel-btn').focus();
        }

        // ---- All your original code below – unchanged, with Jikan fallback added ----
        window.addEventListener('blur', () => {
            if (document.getElementById('player-overlay').style.display === 'block') {
                setTimeout(() => { window.focus(); }, 500);
            }
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(regs => { regs.forEach(r => r.unregister()) });
        }

        let API_KEY = '', activeType = 'trending', activeID = '', currentMedia = {};
        let currentPage = 1, isLoading = false, hasMore = true;
        let savedScrollPosition = 0, lastFocusedElement = null; 

        async function fetchConfig() {
            try {
                const res = await fetch(window.location.origin + '/api/config');
                const data = await res.json();
                if (!data.tmdb_key) {
                    document.getElementById('movie-grid').innerHTML = '<p style="color:red; text-align:center; padding:20px;">Error: API Key Not Found.</p>';
                    return;
                }
                API_KEY = data.tmdb_key;
                renderContinueWatching();
                fetchContent();
            } catch (err) { 
                document.getElementById('movie-grid').innerHTML = '<p style="color:red; text-align:center; padding:20px;">Connection Error: Could not reach Config API.</p>';
            }
        }

        async function fetchContent(append = false) {
            if (isLoading || !API_KEY || (append && !hasMore)) return; 
            isLoading = true;
            if (!append) { currentPage = 1; hasMore = true; document.getElementById('movie-grid').innerHTML = ''; }
            
            if (activeType === 'anime') { await fetchAniList(append); isLoading = false; return; }

            if (activeType === 'list') {
                try {
                    const res = await fetch(`https://api.themoviedb.org/3/list/${activeID}?api_key=${API_KEY}&page=${currentPage}`);
                    const data = await res.json();
                    const listItems = data.items || data.results || [];
                    if (listItems.length > 0) { renderGrid(listItems); currentPage++; hasMore = data.total_pages ? currentPage <= data.total_pages : listItems.length === 20; } else { hasMore = false; }
                } catch (err) { console.error("Fetch failed", err); } finally { isLoading = false; }
                return;
            }

            let url = `https://api.themoviedb.org/3/trending/all/day?api_key=${API_KEY}&page=${currentPage}`;
            if (activeType === 'genre') url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=${activeID}&page=${currentPage}`;
            if (activeType === 'network') url = `https://api.themoviedb.org/3/discover/tv?api_key=${API_KEY}&with_networks=${activeID}&page=${currentPage}`;
            if (activeType === 'search') url = `https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${activeID}&page=${currentPage}`;
            if (activeType === 'kdrama') url = `https://api.themoviedb.org/3/discover/tv?api_key=${API_KEY}&with_original_language=ko&sort_by=popularity.desc&page=${currentPage}`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                if (data.results && data.results.length > 0) { renderGrid(data.results); currentPage++; hasMore = currentPage <= data.total_pages; } else { hasMore = false; }
            } catch (err) { console.error("Fetch failed", err); } finally { isLoading = false; }
        }

        async function fetchAniList(append) {
            const query = `query ($page: Int) { Page(page: $page, perPage: 20) { pageInfo { hasNextPage } media(type: ANIME, sort: TRENDING_DESC) { id title { english romaji native } coverImage { extraLarge } countryOfOrigin averageScore } } }`;
            try {
                const response = await fetch('https://graphql.anilist.co', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ query, variables: { page: currentPage } }) });
                const json = await response.json();
                const results = json.data.Page.media;
                const grid = document.getElementById('movie-grid');
                for (const m of results) {
                    const card = document.createElement('div');
                    card.className = "movie-card focusable";
                    card.tabIndex = 0;
                    let searchTitle = m.title.english || m.title.romaji || m.title.native || '';
                    // If no English title, we'll use the native (Japanese) title directly.
                    if (!searchTitle) searchTitle = m.title.native || 'Unknown';
                    // Store the original title for later use in Jikan fallback
                    card.dataset.originalTitle = searchTitle;
                    card.onclick = () => openDetails(m.id, 'tv', true, searchTitle);
                    card.innerHTML = `<img src="${m.coverImage.extraLarge}" class="w-full h-full object-cover"><div class="origin-badge">${m.countryOfOrigin || 'ANIME'}</div>`;
                    grid.appendChild(card);
                }
                currentPage++; hasMore = json.data.Page.pageInfo.hasNextPage;
            } catch (err) { console.error("AniList Error", err); }
        }

        function renderGrid(results) {
            const grid = document.getElementById('movie-grid');
            results.forEach(m => {
                if (!m.poster_path) return;
                const card = document.createElement('div');
                card.className = "movie-card focusable";
                card.tabIndex = 0;
                card.onclick = () => openDetails(m.id, m.media_type || (m.first_air_date ? 'tv' : 'movie'));
                card.innerHTML = `<img src="https://image.tmdb.org/t/p/w500${m.poster_path}" class="w-full h-full object-cover">`;
                grid.appendChild(card);
            });
        }

        // --- Jikan API helper ---
        async function fetchJikanTitle(animeTitle) {
            try {
                const res = await fetch(`https://api.jikan.moe/v4/anime?q=${encodeURIComponent(animeTitle)}&limit=1`);
                const data = await res.json();
                if (data.data && data.data.length > 0) {
                    return data.data[0].title; // Jikan returns the Japanese title as 'title'
                }
                return null;
            } catch (e) {
                return null;
            }
        }

        // --- Modified openDetails with Jikan fallback ---
        async function openDetails(id, type, isAniList = false, searchTitle = '') {
            savedScrollPosition = window.scrollY || document.documentElement.scrollTop; 
            lastFocusedElement = document.activeElement; 
            let finalId = id;
            let mediaType = type;
            let displayTitle = searchTitle;

            if (isAniList) {
                // Search TMDB using the AniList title
                const searchRes = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${encodeURIComponent(searchTitle)}`);
                const searchData = await searchRes.json();
                if (searchData.results && searchData.results.length > 0) {
                    finalId = searchData.results[0].id;
                    mediaType = searchData.results[0].media_type || 'tv';
                    displayTitle = searchData.results[0].name || searchData.results[0].title || searchTitle;
                } else {
                    // TMDB not found – try to use the title as-is (might be Japanese)
                    // We'll still try to fetch details with a dummy ID? We'll just show the title.
                    currentMedia = { id: finalId, type: 'tv', s: 1, e: 1, title: searchTitle, poster: null, isAnime: true };
                    document.getElementById('show-title').innerText = searchTitle;
                    document.getElementById('show-desc').innerText = 'No description available.';
                    document.getElementById('show-year').innerText = '';
                    document.getElementById('show-rating').innerText = '★ N/A';
                    document.getElementById('details-poster').src = 'IMG_8035.jpeg';
                    document.getElementById('details-backdrop').style.backgroundImage = 'none';
                    document.getElementById('media-type-tag').innerText = 'TV';
                    document.getElementById('movie-action-area').classList.add('hidden');
                    document.getElementById('tv-action-area-top').classList.remove('hidden');
                    document.getElementById('tv-action-area').classList.add('hidden');
                    document.getElementById('main-app-wrapper').style.display = 'none';
                    document.getElementById('selector-overlay').style.display = 'block';
                    window.scrollTo(0, 0);
                    setTimeout(() => { document.getElementById('main-tv-btn').focus(); }, 300);
                    return;
                }
            }

            // Now we have finalId and mediaType (maybe from TMDB)
            const detailsRes = await fetch(`https://api.themoviedb.org/3/${mediaType}/${finalId}?api_key=${API_KEY}`);
            const data = await detailsRes.json();
            if (!data || data.status_code) {
                // TMDB error – use fallback
                currentMedia = { id: finalId, type: mediaType, s: 1, e: 1, title: displayTitle, poster: null, isAnime: isAniList };
                document.getElementById('show-title').innerText = displayTitle;
                document.getElementById('show-desc').innerText = 'No description available.';
                document.getElementById('show-year').innerText = '';
                document.getElementById('show-rating').innerText = '★ N/A';
                document.getElementById('details-poster').src = 'IMG_8035.jpeg';
                document.getElementById('details-backdrop').style.backgroundImage = 'none';
                document.getElementById('media-type-tag').innerText = mediaType.toUpperCase();
                document.getElementById('movie-action-area').classList.toggle('hidden', mediaType !== 'movie');
                document.getElementById('tv-action-area-top').classList.toggle('hidden', mediaType !== 'tv');
                document.getElementById('tv-action-area').classList.toggle('hidden', mediaType !== 'tv');
                if (mediaType === 'tv') renderSeasons({ seasons: [{ season_number: 1 }] });
            } else {
                // Normal flow
                let titleFromData = data.name || data.title || displayTitle;
                // For anime, try to get Japanese title
                let finalTitle = titleFromData;
                if (isAniList && data.original_title && data.original_language === 'ja') {
                    finalTitle = data.original_title;
                } else if (isAniList && data.original_name && data.original_language === 'ja') {
                    finalTitle = data.original_name;
                }
                // If still no Japanese characters, call Jikan API
                if (isAniList && !finalTitle.match(/[\u3000-\u30FF\u4E00-\u9FFF]/)) {
                    const jpTitle = await fetchJikanTitle(titleFromData);
                    if (jpTitle) finalTitle = jpTitle;
                }

                currentMedia = { id: finalId, type: mediaType, s: 1, e: 1, title: finalTitle, poster: data.poster_path, isAnime: isAniList };
                document.getElementById('show-title').innerText = finalTitle;
                document.getElementById('show-desc').innerText = data.overview || "No description available.";
                document.getElementById('show-year').innerText = (data.release_date || data.first_air_date || '').split('-')[0];
                document.getElementById('show-rating').innerText = `★ ${data.vote_average ? data.vote_average.toFixed(1) : 'N/A'}`;
                document.getElementById('details-poster').src = data.poster_path ? `https://image.tmdb.org/t/p/w500${data.poster_path}` : 'IMG_8035.jpeg';
                document.getElementById('details-backdrop').style.backgroundImage = data.backdrop_path ? `url(https://image.tmdb.org/t/p/original${data.backdrop_path})` : 'none';
                document.getElementById('media-type-tag').innerText = mediaType.toUpperCase();
                document.getElementById('movie-action-area').classList.toggle('hidden', mediaType !== 'movie');
                document.getElementById('tv-action-area-top').classList.toggle('hidden', mediaType !== 'tv');
                document.getElementById('tv-action-area').classList.toggle('hidden', mediaType !== 'tv');
                if (mediaType === 'tv') renderSeasons(data);
            }

            document.getElementById('main-app-wrapper').style.display = 'none';
            document.getElementById('selector-overlay').style.display = 'block';
            window.scrollTo(0, 0);
            setTimeout(() => { const playBtn = (mediaType === 'movie') ? document.getElementById('play-movie-btn') : document.getElementById('main-tv-btn'); if(playBtn) playBtn.focus(); }, 300);
        }

        function renderSeasons(data) {
            const container = document.getElementById('season-buttons');
            container.innerHTML = '';
            if (!container.parentElement.classList.contains('season-scroll-wrapper')) {
                const wrapper = document.createElement('div');
                wrapper.className = 'season-scroll-wrapper relative flex items-center mb-6 w-full';
                const leftBtn = document.createElement('button');
                leftBtn.className = 'focusable absolute left-0 z-20 bg-black/95 text-gold border border-gold/30 w-8 h-8 rounded-full flex items-center justify-center font-black shadow-xl';
                leftBtn.innerHTML = '❮';
                leftBtn.onclick = () => container.scrollBy({left: -250, behavior: 'smooth'});
                const rightBtn = document.createElement('button');
                rightBtn.className = 'focusable absolute right-0 z-20 bg-black/95 text-gold border border-gold/30 w-8 h-8 rounded-full flex items-center justify-center font-black shadow-xl';
                rightBtn.innerHTML = '❯';
                rightBtn.onclick = () => container.scrollBy({left: 250, behavior: 'smooth'});
                container.classList.remove('mb-6'); container.parentNode.insertBefore(wrapper, container);
                wrapper.appendChild(leftBtn); wrapper.appendChild(container); wrapper.appendChild(rightBtn);
            }
            const wrapper = container.parentElement;
            let validSeasons = data.seasons ? data.seasons.filter(s => s.season_number > 0) : [];
            if (validSeasons.length > 4) { wrapper.children[0].style.display = 'flex'; wrapper.children[2].style.display = 'flex'; container.style.padding = '0 36px'; } else { wrapper.children[0].style.display = 'none'; wrapper.children[2].style.display = 'none'; container.style.padding = '0'; }
            if(!data.seasons) return;
            data.seasons.forEach(s => {
                if (s.season_number === 0) return;
                const btn = document.createElement('button');
                btn.className = "focusable px-4 py-2 bg-zinc-900 rounded-lg text-xs font-bold border border-white/5 whitespace-nowrap";
                btn.innerText = `Season ${s.season_number}`; btn.tabIndex = 0; btn.onclick = () => loadEpisodes(data.id, s.season_number);
                btn.addEventListener('focus', function() { setTimeout(() => { container.scrollLeft = this.offsetLeft - (container.offsetWidth / 2) + (this.offsetWidth / 2); }, 100); });
                container.appendChild(btn);
            });
            if(container.firstChild) container.firstChild.click();
        }

        async function loadEpisodes(showId, seasonNum) {
            const res = await fetch(`https://api.themoviedb.org/3/tv/${showId}/season/${seasonNum}?api_key=${API_KEY}`);
            const data = await res.json();
            const grid = document.getElementById('episode-grid');
            grid.innerHTML = '';
            if(data.episodes) {
                data.episodes.forEach(e => {
                    const epRow = document.createElement('div');
                    epRow.className = "episode-row focusable";
                    epRow.tabIndex = 0;
                    epRow.onclick = () => { currentMedia.s = seasonNum; currentMedia.e = e.episode_number; startLuxeStream(); };
                    const thumb = e.still_path ? `https://image.tmdb.org/t/p/w300${e.still_path}` : '';
                    epRow.innerHTML = `<div class="ep-thumbnail" style="background-image:url(${thumb})"><div class="ep-play-btn">▶</div></div><div class="flex-1"><div class="text-white font-bold text-sm">E${e.episode_number} ${e.name}</div><div class="text-zinc-500 text-xs line-clamp-2 mt-1">${e.overview}</div></div>`;
                    grid.appendChild(epRow);
                });
            }
            document.getElementById('main-tv-btn').innerText = `▶ Play S${seasonNum} E1`;
        }

        function playCurrentEpisode() { currentMedia.e = 1; startLuxeStream(); }
        function saveToHistory(id, type, s, e, title, poster) {
            let history = JSON.parse(localStorage.getItem('zonhd_history') || '[]');
            history = history.filter(item => item.id !== id);
            history.unshift({ id, type, s, e, title, poster });
            localStorage.setItem('zonhd_history', JSON.stringify(history.slice(0, 10)));
            renderContinueWatching();
        }

        function renderContinueWatching() {
            const history = JSON.parse(localStorage.getItem('zonhd_history') || '[]');
            const section = document.getElementById('continue-section');
            const grid = document.getElementById('continue-grid');
            if (history.length === 0) { section.classList.add('hidden'); return; }
            section.classList.remove('hidden'); grid.innerHTML = '';
            history.forEach(item => {
                const card = document.createElement('div');
                card.className = "min-w-[120px] max-w-[120px] cursor-pointer focusable movie-card";
                card.tabIndex = 0;
                card.onclick = () => openDetails(item.id, item.type);
                card.innerHTML = `<div class="aspect-[2/3] rounded-lg overflow-hidden border border-white/10 mb-2"><img src="https://image.tmdb.org/t/p/w300${item.poster}" class="w-full h-full object-cover"></div><p class="text-[10px] font-bold truncate text-zinc-400 uppercase tracking-tighter">${item.title}</p><p class="text-[8px] text-gold font-bold">${item.type === 'tv' ? `S${item.s} E${item.e}` : 'MOVIE'}</p>`;
                grid.appendChild(card);
            });
        }

        function closeSelector() { document.getElementById('selector-overlay').style.display = 'none'; document.getElementById('main-app-wrapper').style.display = 'block'; window.scrollTo(0, savedScrollPosition); if (lastFocusedElement) lastFocusedElement.focus(); }
        function toggleMenu() { document.getElementById('side-menu').classList.toggle('menu-open'); }
        function setFilter(type, id = '') { activeType = type; activeID = id; document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-filter')); if (event && event.target && event.target.tagName === 'BUTTON') event.target.classList.add('active-filter'); fetchContent(); document.getElementById('side-menu').classList.remove('menu-open'); window.scrollTo(0,0); }
        function triggerSearch() { const input = document.getElementById('search-input'); const query = input.value.trim(); if(query) { setFilter('search', query); } }
        function handleSearch(e) { if (e.key === 'Enter') triggerSearch(); }

        window.onload = () => { setTimeout(() => { const loader = document.getElementById('loader'); if(loader) { loader.style.opacity = '0'; setTimeout(() => loader.remove(), 500); } }, 1000); fetchConfig(); const mc = new Hammer(document.body); mc.on("swiperight", () => toggleMenu()); };
        window.addEventListener('scroll', () => { if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 1000) fetchContent(true); });
    </script>
</body>
</html>
