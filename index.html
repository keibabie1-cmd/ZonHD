<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="IMG_8035.jpeg">
    <title>ZonHD Cinema</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,900;1,900&family=Inter:wght@300;700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #D4AF37; --red: #FF0000; --black: #050505; }
        body { background: var(--black); color: white; font-family: 'Inter', sans-serif; margin: 0; padding: 0; overflow-x: hidden; }
        
        [tabindex="0"]:focus {
            outline: none !important;
            border: 4px solid var(--gold) !important;
            box-shadow: 0 0 30px var(--red) !important;
            transform: scale(1.05);
            z-index: 99;
            transition: all 0.2s ease-in-out;
        }

        #loader { position: fixed; inset: 0; background: var(--black); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s ease; }
        .loader-medusa { width: 150px; height: 150px; border-radius: 50%; background: url('IMG_8035.jpeg'); background-size: cover; border: 3px solid var(--gold); box-shadow: 0 0 50px var(--red); animation: pulse 2s infinite ease-in-out; }
        @keyframes pulse { 0%, 100% { transform: scale(0.9); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 1; } }

        .hero-banner { height: 60vh; position: relative; background: linear-gradient(to bottom, transparent, var(--black)), url('IMG_8035.jpeg'); background-size: cover; background-position: center; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 50px; }
        .zonhd-logo { font-family: 'Playfair Display', serif; font-size: clamp(3rem, 12vw, 6rem); color: var(--gold); text-shadow: 0 0 30px var(--red); font-style: italic; }

        #side-menu { position: fixed; top: 0; left: 0; bottom: 0; width: 280px; background: #000; border-right: 1px solid var(--gold); z-index: 3000; transform: translateX(-100%); transition: 0.4s; }
        .menu-open { transform: translateX(0) !important; }

        .movie-card { position: relative; aspect-ratio: 2/3; border-radius: 12px; overflow: hidden; border: 1px solid #1a1a1a; cursor: pointer; }
        #player-overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 5000; }
        #ad-shield { position: absolute; inset: 0; z-index: 6000; background: rgba(0,0,0,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .active-season { background: var(--gold) !important; color: black !important; }
    </style>
</head>
<body id="swipe-area">

    <div id="loader"><div class="loader-medusa"></div><p class="text-gold mt-6 tracking-[0.5em] font-bold">ZonHD CINEMA</p></div>

    <div id="side-menu" class="p-8 no-scrollbar overflow-y-auto">
        <h2 class="text-gold font-bold mb-8 italic border-b border-red-900 pb-2 uppercase tracking-tighter">Networks</h2>
        <div class="flex flex-col gap-6 text-zinc-400 font-bold uppercase text-xs tracking-widest">
            <button tabindex="0" onclick="setFilter('network', 213)">Netflix</button>
            <button tabindex="0" onclick="setFilter('network', 2739)">Disney+</button>
            <button tabindex="0" onclick="setFilter('network', 453)">Hulu</button>
            <button tabindex="0" onclick="setFilter('network', 34)">Adult Swim</button>
            <button tabindex="0" onclick="setFilter('network', 19)">Nickelodeon</button>
            <button tabindex="0" onclick="setFilter('network', 56)">Cartoon Network</button>
            <button tabindex="0" onclick="setFilter('network', 2552)">Boomerang</button>
        </div>
    </div>

    <header class="hero-banner"><h1 class="zonhd-logo">ZonHD</h1><p class="text-gold tracking-[0.8em] text-[10px] font-bold">CINEMA LUXE</p></header>

    <div class="sticky top-0 z-[1000] bg-black/95 border-b border-zinc-900">
        <input type="text" tabindex="0" id="search-input" class="w-[90%] mx-auto block bg-white/5 border border-gold/20 rounded-full py-2 px-6 my-4 text-white outline-none" placeholder="Search Master Library..." onkeyup="handleSearch(event)">
        <nav class="flex p-4 gap-8 overflow-x-auto no-scrollbar items-center">
            <button tabindex="0" onclick="toggleMenu()" class="text-gold text-2xl">☰</button>
            <button tabindex="0" onclick="setFilter('trending')" class="text-red-600 font-black">TRENDING</button>
            <button tabindex="0" onclick="setFilter('genre', 27)" class="font-bold">HORROR</button>
            <button tabindex="0" onclick="setFilter('genre', 28)" class="font-bold">ACTION</button>
            <button tabindex="0" onclick="setFilter('genre', 16)" class="font-bold">ANIME</button>
            <button tabindex="0" onclick="setFilter('genre', 10751)" class="font-bold whitespace-nowrap">FAMILY</button>
        </nav>
    </div>

    <div id="continue-section" class="p-4 hidden">
        <h3 class="text-gold font-bold italic mb-4 text-xs tracking-widest uppercase">Continue Watching</h3>
        <div id="continue-grid" class="flex gap-4 overflow-x-auto no-scrollbar"></div>
    </div>

    <main id="movie-grid" class="p-4 grid grid-cols-2 md:grid-cols-5 gap-4"></main>

    <div id="selector-overlay" class="fixed inset-0 bg-black/98 z-[4000] hidden overflow-y-auto p-6 md:p-12">
        <div class="max-w-5xl mx-auto">
            <button onclick="closeSelector()" class="bg-zinc-900 text-gold border border-gold/30 px-6 py-2 rounded-full mb-8 font-bold text-xs">✕ BACK TO LIBRARY</button>
            <h2 id="show-title" class="text-4xl font-black text-white mb-6 italic tracking-tighter"></h2>
            <div id="season-buttons" class="flex gap-3 overflow-x-auto pb-6 no-scrollbar"></div>
            <div id="episode-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mt-4"></div>
        </div>
    </div>

    <div id="player-overlay">
        <div id="ad-shield" onclick="unlockCinema()" tabindex="0">
            <div class="loader-medusa" style="width:100px; height:100px; margin-bottom:20px;"></div>
            <div class="bg-red-700 text-white px-10 py-4 rounded-full font-bold shadow-2xl animate-bounce uppercase">Start Stream (Unmuted)</div>
            <p class="text-gold text-[10px] mt-6 tracking-widest uppercase opacity-60">Shield Active: Ads & Popups Blocked</p>
        </div>
        <div class="flex justify-between p-6 absolute top-0 w-full z-[7000]">
            <button tabindex="0" id="close-btn" onclick="closePlayer()" class="bg-black/50 text-white px-6 py-2 rounded-full font-bold text-xs border border-white/20 hover:bg-red-700">✕ CLOSE</button>
        </div>
        <div id="player-container" class="w-full h-full"></div>
    </div>

    <script>
        const API_KEY = 'b9c746781e1e9b084c4cc4f0420156d4';
        let page = 1;
        let activeType = 'trending';
        let activeID = '';
        let currentStreamUrl = '';
        let currentMediaContext = {};

        window.onload = () => { setTimeout(() => { document.getElementById('loader').style.opacity = '0'; setTimeout(() => document.getElementById('loader').remove(), 600); }, 1500); };

        const mc = new Hammer(document.getElementById('swipe-area'));
        mc.on("swiperight", () => document.getElementById('side-menu').classList.add('menu-open'));
        mc.on("swipeleft", () => document.getElementById('side-menu').classList.remove('menu-open'));

        async function fetchContent(append = false) {
            let url = `https://api.themoviedb.org/3/trending/all/day?api_key=${API_KEY}&page=${page}`;
            if (activeType === 'genre') url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=${activeID}&page=${page}`;
            if (activeType === 'network') url = `https://api.themoviedb.org/3/discover/tv?api_key=${API_KEY}&with_networks=${activeID}&page=${page}`;
            if (activeType === 'search') url = `https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${activeID}&page=${page}`;

            const res = await fetch(url);
            const data = await res.json();
            const grid = document.getElementById('movie-grid');
            if (!append) grid.innerHTML = '';
            
            data.results.forEach(m => {
                if (!m.poster_path) return;
                let type = m.media_type || (m.first_air_date ? 'tv' : 'movie');
                const card = document.createElement('div');
                card.className = "movie-card";
                card.setAttribute('tabindex', '0');
                card.onclick = () => playMedia(m.id, type, m.poster_path);
                card.onkeydown = (e) => { if(e.key === 'Enter') card.click(); };
                card.innerHTML = `<img src="https://image.tmdb.org/t/p/w500${m.poster_path}" class="w-full h-full object-cover">`;
                grid.appendChild(card);
            });
        }

        async function playMedia(id, type, poster, s = null, e = null) {
            currentMediaContext = { id, type, poster, s: s || 1, e: e || 1 };

            if (type === 'tv' && s === null) {
                openSelector(id);
            } else {
                if (type === 'tv') {
                    currentStreamUrl = `https://vidlink.pro/tv/${id}/${s}/${e}?autoplay=true`;
                } else {
                    currentStreamUrl = `https://vidlink.pro/movie/${id}?autoplay=true`;
                }
                startPlayer();
            }
        }

        async function openSelector(id) {
            const res = await fetch(`https://api.themoviedb.org/3/tv/${id}?api_key=${API_KEY}`);
            const data = await res.json();
            
            document.getElementById('show-title').innerText = data.name;
            const seasonContainer = document.getElementById('season-buttons');
            seasonContainer.innerHTML = '';
            
            data.seasons.forEach(s => {
                if (s.season_number === 0 || !s.air_date) return;
                const btn = document.createElement('button');
                btn.className = "px-6 py-2 bg-zinc-900 rounded-full text-[10px] font-bold uppercase tracking-widest border border-zinc-800 focus:bg-gold";
                btn.innerText = `Season ${s.season_number}`;
                btn.onclick = () => {
                    document.querySelectorAll('#season-buttons button').forEach(b => b.classList.remove('active-season'));
                    btn.classList.add('active-season');
                    loadEpisodes(id, s.season_number, data.poster_path);
                };
                seasonContainer.appendChild(btn);
            });
            
            document.getElementById('selector-overlay').classList.remove('hidden');
            seasonContainer.firstChild.click(); // Auto-load first season
        }

        async function loadEpisodes(showId, seasonNum, poster) {
            const res = await fetch(`https://api.themoviedb.org/3/tv/${showId}/season/${seasonNum}?api_key=${API_KEY}`);
            const data = await res.json();
            const grid = document.getElementById('episode-grid');
            grid.innerHTML = '';

            data.episodes.forEach(e => {
                const ep = document.createElement('div');
                ep.className = "bg-zinc-900/50 p-4 rounded-xl border border-zinc-800 hover:border-gold cursor-pointer transition-all flex items-center gap-4";
                ep.tabIndex = "0";
                ep.innerHTML = `
                    <div class="text-gold font-black text-xl">#${e.episode_number}</div>
                    <div class="text-left"><p class="text-white font-bold text-sm">${e.name}</p></div>
                `;
                ep.onclick = () => playMedia(showId, 'tv', poster, seasonNum, e.episode_number);
                ep.onkeydown = (k) => { if(k.key === 'Enter') ep.click(); };
                grid.appendChild(ep);
            });
        }

        function startPlayer() {
            document.getElementById('selector-overlay').classList.add('hidden');
            document.getElementById('player-overlay').style.display = 'block';
            document.getElementById('ad-shield').style.display = 'flex';
            document.getElementById('ad-shield').focus();
        }

        function unlockCinema() {
            const shield = document.getElementById('ad-shield');
            const container = document.getElementById('player-container');
            
            // Save to Continue Watching
            const { id, type, poster, s, e } = currentMediaContext;
            let history = JSON.parse(localStorage.getItem('zonhd_history') || '[]');
            history = history.filter(item => item.id !== id);
            history.unshift({ id, type, poster, s, e });
            localStorage.setItem('zonhd_history', JSON.stringify(history.slice(0, 10)));
            loadContinueWatching();

            shield.innerHTML = `<div class="bg-red-700 text-white px-10 py-4 rounded-full font-bold shadow-2xl">BYPASSING ADS...</div>`;
            
            container.innerHTML = `<iframe id="cinema-frame" src="${currentStreamUrl}" allow="autoplay; fullscreen" sandbox="allow-scripts allow-forms allow-same-origin" allowfullscreen class="w-full h-full border-none"></iframe>`;
            
            setTimeout(() => {
                shield.style.display = 'none';
                shield.innerHTML = `<div class="loader-medusa" style="width:100px; height:100px; margin-bottom:20px;"></div><div class="bg-red-700 text-white px-10 py-4 rounded-full font-bold shadow-2xl animate-bounce uppercase">Start Stream (Unmuted)</div>`;
                document.getElementById('close-btn').focus();
            }, 1500);
        }

        function loadContinueWatching() {
            const history = JSON.parse(localStorage.getItem('zonhd_history') || '[]');
            const container = document.getElementById('continue-grid');
            const section = document.getElementById('continue-section');
            if (history.length > 0) {
                section.classList.remove('hidden');
                container.innerHTML = history.map(m => `
                    <div tabindex="0" class="relative min-w-[110px] h-[160px] rounded-lg overflow-hidden border border-zinc-800 flex-shrink-0" onclick="playMedia('${m.id}', '${m.type}', '${m.poster}', ${m.s}, ${m.e})" onkeydown="if(event.key==='Enter')this.click()">
                        <img src="https://image.tmdb.org/t/p/w300${m.poster}" class="w-full h-full object-cover">
                        ${m.type === 'tv' ? `<div class="absolute bottom-0 left-0 right-0 bg-red-700 text-[9px] text-center font-black py-1">S${m.s} E${m.e}</div>` : ''}
                    </div>
                `).join('');
            }
        }

        function handleSearch(e) { if (e.key === 'Enter') { activeType = 'search'; activeID = e.target.value; page = 1; fetchContent(); } }
        function setFilter(type, id = '') { activeType = type; activeID = id; page = 1; document.getElementById('side-menu').classList.remove('menu-open'); window.scrollTo(0,0); fetchContent(); }
        function toggleMenu() { document.getElementById('side-menu').classList.toggle('menu-open'); }
        function closeSelector() { document.getElementById('selector-overlay').classList.add('hidden'); }
        function closePlayer() { document.getElementById('player-overlay').style.display = 'none'; document.getElementById('player-container').innerHTML = ''; }

        window.onscroll = () => { if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 1200) { page++; fetchContent(true); } };
        loadContinueWatching();
        fetchContent();
    <script>
    const API_KEY = 'b9c746781e1e9b084c4cc4f0420156d4';
    let page = 1;
    let activeType = 'trending';
    let activeID = '';
    let currentStreamUrl = '';
    let currentMediaContext = {};

    // LOADER REMOVAL - This is what was getting stuck
    window.onload = () => { 
        setTimeout(() => { 
            document.getElementById('loader').style.opacity = '0'; 
            setTimeout(() => document.getElementById('loader').remove(), 600); 
        }, 1500); 
    };

    // SWIPE NAVIGATION
    const mc = new Hammer(document.getElementById('swipe-area'));
    mc.on("swiperight", () => document.getElementById('side-menu').classList.add('menu-open'));
    mc.on("swipeleft", () => document.getElementById('side-menu').classList.remove('menu-open'));

    async function fetchContent(append = false) {
        let url = `https://api.themoviedb.org/3/trending/all/day?api_key=${API_KEY}&page=${page}`;
        if (activeType === 'genre') url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=${activeID}&page=${page}`;
        if (activeType === 'network') url = `https://api.themoviedb.org/3/discover/tv?api_key=${API_KEY}&with_networks=${activeID}&page=${page}`;
        if (activeType === 'search') url = `https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${activeID}&page=${page}`;

        const res = await fetch(url);
        const data = await res.json();
        const grid = document.getElementById('movie-grid');
        if (!append) grid.innerHTML = '';
        
        data.results.forEach(m => {
            if (!m.poster_path) return;
            let type = m.media_type || (m.first_air_date ? 'tv' : 'movie');
            const card = document.createElement('div');
            card.className = "movie-card";
            card.setAttribute('tabindex', '0');
            card.onclick = () => playMedia(m.id, type, m.poster_path);
            card.onkeydown = (e) => { if(e.key === 'Enter') card.click(); };
            card.innerHTML = `<img src="https://image.tmdb.org/t/p/w500${m.poster_path}" class="w-full h-full object-cover">`;
            grid.appendChild(card);
        });
    }

    async function playMedia(id, type, poster, s = null, e = null) {
        currentMediaContext = { id, type, poster, s: s || 1, e: e || 1 };
        if (type === 'tv' && s === null) {
            openSelector(id);
        } else {
            currentStreamUrl = type === 'tv' ? 
                `https://vidlink.pro/tv/${id}/${s}/${e}?autoplay=true` : 
                `https://vidlink.pro/movie/${id}?autoplay=true`;
            startPlayer();
        }
    }

    async function openSelector(id) {
        const res = await fetch(`https://api.themoviedb.org/3/tv/${id}?api_key=${API_KEY}`);
        const data = await res.json();
        document.getElementById('show-title').innerText = data.name;
        const seasonContainer = document.getElementById('season-buttons');
        seasonContainer.innerHTML = '';
        data.seasons.forEach(s => {
            if (s.season_number === 0 || !s.air_date) return;
            const btn = document.createElement('button');
            btn.className = "px-6 py-2 bg-zinc-900 rounded-full text-[10px] font-bold uppercase tracking-widest border border-zinc-800 focus:bg-gold";
            btn.innerText = `Season ${s.season_number}`;
            btn.onclick = () => {
                document.querySelectorAll('#season-buttons button').forEach(b => b.classList.remove('active-season'));
                btn.classList.add('active-season');
                loadEpisodes(id, s.season_number, data.poster_path);
            };
            seasonContainer.appendChild(btn);
        });
        document.getElementById('selector-overlay').classList.remove('hidden');
        if(seasonContainer.firstChild) seasonContainer.firstChild.click();
    }

    async function loadEpisodes(showId, seasonNum, poster) {
        const res = await fetch(`https://api.themoviedb.org/3/tv/${showId}/season/${seasonNum}?api_key=${API_KEY}`);
        const data = await res.json();
        const grid = document.getElementById('episode-grid');
        grid.innerHTML = '';
        data.episodes.forEach(e => {
            const ep = document.createElement('div');
            ep.className = "bg-zinc-900/50 p-4 rounded-xl border border-zinc-800 hover:border-gold cursor-pointer transition-all flex items-center gap-4";
            ep.tabIndex = "0";
            ep.innerHTML = `<div class="text-gold font-black text-xl">#${e.episode_number}</div><div class="text-left"><p class="text-white font-bold text-sm">${e.name}</p></div>`;
            ep.onclick = () => playMedia(showId, 'tv', poster, seasonNum, e.episode_number);
            ep.onkeydown = (k) => { if(k.key === 'Enter') ep.click(); };
            grid.appendChild(ep);
        });
    }

    function startPlayer() {
        document.getElementById('selector-overlay').classList.add('hidden');
        document.getElementById('player-overlay').style.display = 'block';
        document.getElementById('ad-shield').style.display = 'flex';
        document.getElementById('ad-shield').focus();
    }

    function unlockCinema() {
        const shield = document.getElementById('ad-shield');
        const container = document.getElementById('player-container');
        const { id, type, poster, s, e } = currentMediaContext;
        let history = JSON.parse(localStorage.getItem('zonhd_history') || '[]');
        history = history.filter(item => item.id !== id);
        history.unshift({ id, type, poster, s, e });
        localStorage.setItem('zonhd_history', JSON.stringify(history.slice(0, 10)));
        loadContinueWatching();
        shield.innerHTML = `<div class="bg-red-700 text-white px-10 py-4 rounded-full font-bold shadow-2xl">BYPASSING ADS...</div>`;
        container.innerHTML = `<iframe id="cinema-frame" src="${currentStreamUrl}" allow="autoplay; fullscreen" sandbox="allow-scripts allow-forms allow-same-origin" allowfullscreen class="w-full h-full border-none"></iframe>`;
        setTimeout(() => {
            shield.style.display = 'none';
            shield.innerHTML = `<div class="loader-medusa" style="width:100px; height:100px; margin-bottom:20px;"></div><div class="bg-red-700 text-white px-10 py-4 rounded-full font-bold shadow-2xl animate-bounce uppercase">Start Stream (Unmuted)</div>`;
            document.getElementById('close-btn').focus();
        }, 1500);
    }

    function loadContinueWatching() {
        const history = JSON.parse(localStorage.getItem('zonhd_history') || '[]');
        const container = document.getElementById('continue-grid');
        const section = document.getElementById('continue-section');
        if (history.length > 0) {
            section.classList.remove('hidden');
            container.innerHTML = history.map(m => `
                <div tabindex="0" class="relative min-w-[110px] h-[160px] rounded-lg overflow-hidden border border-zinc-800 flex-shrink-0" onclick="playMedia('${m.id}', '${m.type}', '${m.poster}', ${m.s}, ${m.e})" onkeydown="if(event.key==='Enter')this.click()">
                    <img src="https://image.tmdb.org/t/p/w300${m.poster}" class="w-full h-full object-cover">
                    ${m.type === 'tv' ? `<div class="absolute bottom-0 left-0 right-0 bg-red-700 text-[9px] text-center font-black py-1">S${m.s} E${m.e}</div>` : ''}
                </div>
            `).join('');
        }
    }

    function handleSearch(e) { if (e.key === 'Enter') { activeType = 'search'; activeID = e.target.value; page = 1; fetchContent(); } }
    function setFilter(type, id = '') { activeType = type; activeID = id; page = 1; document.getElementById('side-menu').classList.remove('menu-open'); window.scrollTo(0,0); fetchContent(); }
    function toggleMenu() { document.getElementById('side-menu').classList.toggle('menu-open'); }
    function closeSelector() { document.getElementById('selector-overlay').classList.add('hidden'); }
    function closePlayer() { document.getElementById('player-overlay').style.display = 'none'; document.getElementById('player-container').innerHTML = ''; }

    window.onscroll = () => { if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 1200) { page++; fetchContent(true); } };

    // PWA SERVICE WORKER REGISTRATION
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/service-worker.js')
                .then(reg => console.log('ZonHD Service Worker Active'))
                .catch(err => console.log('Worker Sync Failed', err));
        });
    }

    // INITIAL LOAD
    loadContinueWatching();
    fetchContent();
</script>
</body>
</html>
