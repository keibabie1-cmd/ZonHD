<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZonHD Cinema</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050505; color: white; font-family: sans-serif; }
        .medusa-glow { text-shadow: 0 0 20px #ff0000, 0 0 30px #ff0000; }
        .movie-card:hover { transform: scale(1.05); transition: 0.3s; }
    </style>
</head>
<body>
    <div class="p-8 text-center">
        <h1 class="text-6xl font-bold text-red-600 medusa-glow mb-4">ZonHD</h1>
        <p class="text-gray-400">Premium Streaming Experience</p>
    </div>

    <div class="max-w-6xl mx-auto p-4 grid grid-cols-2 md:grid-cols-4 gap-6" id="movie-grid">
        <div class="text-center p-10 col-span-full">
            <div class="animate-spin inline-block w-8 h-8 border-4 border-red-600 border-t-transparent rounded-full"></div>
            <p class="mt-4">Waking the Medusa...</p>
        </div>
    </div>

    <script>
        // Insert your TMDB API Key below if you have it
        const API_KEY = 'YOUR_TMDB_API_KEY_HERE'; 
        const grid = document.getElementById('movie-grid');

        async function loadMovies() {
            try {
                const res = await fetch(`https://api.themoviedb.org/3/trending/movie/week?api_key='b9c746781e1e9b084c4cc4f0420156d4`);
                const data = await res.json();
                grid.innerHTML = data.results.map(m => `
                    <div class="movie-card bg-zinc-900 rounded-lg overflow-hidden shadow-xl">
                        <img src="https://image.tmdb.org/t/p/w500${m.poster_path}" alt="${m.title}">
                        <div class="p-2 text-sm font-bold">${m.title}</div>
                    </div>
                `).join('');
            } catch (err) {
                grid.innerHTML = '<p class="col-span-full text-center text-red-500">Failed to load movies. Check your API Key.</p>';
            }
        }
        loadMovies();
    </script>
</body>
</html>
