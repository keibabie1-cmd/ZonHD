<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZonHD Cinema</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #050505; color: white; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .medusa-glow { text-shadow: 0 0 15px rgba(255, 0, 0, 0.8); }
        .movie-card:active { transform: scale(0.95); }
        #player-modal { backdrop-filter: blur(10px); display: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen pb-10">

    <header class="sticky top-0 z-50 bg-black/80 backdrop-blur-md p-4 border-b border-red-900/30">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            <h1 class="text-4xl font-black text-red-600 medusa-glow italic">ZonHD</h1>
            <div class="relative w-full md:w-96">
                <input type="text" id="search-input" placeholder="Search movies..." 
                    class="w-full bg-zinc-900 border border-zinc-800 rounded-full py-2 px-5 text-sm focus:outline-none focus:border-red-600">
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 mt-8">
        <div id="movie-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-6">
            </div>
        
        <div id="loading-trigger" class="py-10 text-center">
            <div class="animate-spin inline-block w-8 h-8 border-4 border-red-600 border-t-transparent rounded-full"></div>
        </div>
    </main>

    <div id="player-modal" class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/95">
        <div class="w-full max-w-5xl aspect-video bg-black relative rounded-xl overflow-hidden shadow-2xl border border-zinc-800">
            <button onclick="closePlayer()" class="absolute top-4 right-4 z-[110] bg-red-600 text-white p-2 rounded-full font-bold">✕</button>
            <iframe id="video-iframe" src="" class="w-full h-full" frameborder="0" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        const API_KEY = 'b9c746781e1e9b084c4cc4f0420156d4';
        const grid = document.getElementById('movie-grid');
        const searchInput = document.getElementById('search-input');
        const modal = document.getElementById('player-modal');
        const iframe = document.getElementById('video-iframe');

        let currentPage = 1;
        let isSearching = false;

        // Fetch movies
        async function fetchMovies(page = 1, query = '') {
            const endpoint = query 
                ? `https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&query=${query}&page=${page}`
                : `https://api.themoviedb.org/3/trending/movie/week?api_key=${API_KEY}&page=${page}`;
            
            const res = await fetch(endpoint);
            const data = await res.json();
            renderMovies(data.results, page === 1);
        }

        function renderMovies(movies, clearGrid) {
            if (clearGrid) grid.innerHTML = '';
            movies.forEach(m => {
                if (!m.poster_path) return;
                const card = document.createElement('div');
                card.className = "movie-card bg-zinc-900 rounded-lg overflow-hidden cursor-pointer hover:ring-2 hover:ring-red-600 transition-all";
                card.onclick = () => openPlayer(m.id);
                card.innerHTML = `
                    <img src="https://image.tmdb.org/t/p/w500${m.poster_path}" class="w-full h-auto">
                    <div class="p-3"><p class="text-xs font-bold truncate">${m.title}</p></div>
                `;
                grid.appendChild(card);
            });
        }

        // Search Logic
        searchInput.oninput = (e) => {
            const val = e.target.value;
            currentPage = 1;
            isSearching = !!val;
            fetchMovies(1, val);
        };

        // Video Player Logic
        function openPlayer(id) {
            // Using a free streaming embed source
            iframe.src = `https://vidsrc.me/embed/movie?tmdb=${id}`;
            modal.style.display = 'flex';
        }

        function closePlayer() {
            modal.style.display = 'none';
            iframe.src = '';
        }

        // Infinite Scroll Logic
        window.onscroll = () => {
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500) {
                currentPage++;
                fetchMovies(currentPage, searchInput.value);
            }
        };

        fetchMovies();
    </script>
</body>
</html>
