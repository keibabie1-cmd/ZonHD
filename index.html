<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-512.png">
    <title>ZonHD Cinema</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,900;1,900&family=Inter:wght@300;700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #D4AF37; --red: #FF0000; --black: #050505; --dark-zinc: #121212; }
        body { background: var(--black); color: white; font-family: 'Inter', sans-serif; margin: 0; padding: 0; overflow-x: hidden; }
        
        [tabindex="0"]:focus {
            outline: none !important;
            border: 4px solid var(--gold) !important;
            box-shadow: 0 0 30px var(--red) !important;
            transform: scale(1.02);
            z-index: 99;
            transition: all 0.2s ease-in-out;
        }

        /* LOADER */
        #loader { position: fixed; inset: 0; background: var(--black); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s ease; }
        .loader-medusa { width: 150px; height: 150px; border-radius: 50%; background: url('IMG_8035.jpeg'); background-size: cover; border: 3px solid var(--gold); box-shadow: 0 0 50px var(--red); animation: pulse 2s infinite ease-in-out; }
        @keyframes pulse { 0%, 100% { transform: scale(0.9); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 1; } }

        .hero-banner { height: 60vh; position: relative; background: linear-gradient(to bottom, transparent, var(--black)), url('IMG_8035.jpeg'); background-size: cover; background-position: center; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 50px; }
        .zonhd-logo { font-family: 'Playfair Display', serif; font-size: clamp(3rem, 12vw, 6rem); color: var(--gold); text-shadow: 0 0 30px var(--red); font-style: italic; }

        #side-menu { position: fixed; top: 0; left: 0; bottom: 0; width: 280px; background: #000; border-right: 1px solid var(--gold); z-index: 3000; transform: translateX(-100%); transition: 0.4s; }
        .menu-open { transform: translateX(0) !important; }

        .movie-card { position: relative; aspect-ratio: 2/3; border-radius: 12px; overflow: hidden; border: 1px solid #1a1a1a; cursor: pointer; transition: 0.3s; }
        .movie-card:hover { border-color: var(--gold); transform: translateY(-5px); }

        /* LUXE DETAILS PAGE OVERLAY */
        #selector-overlay { display: none; position: fixed; inset: 0; background: var(--black); z-index: 4000; overflow-y: auto; }
        #details-backdrop { position: fixed; top: 0; width: 100%; height: 100vh; opacity: 0.25; background-size: cover; background-position: center; filter: blur(8px); pointer-events: none; }
        
        .luxe-btn-main { background: linear-gradient(45deg, var(--gold), #f3d06b); color: black; font-weight: 900; letter-spacing: 0.2em; padding: 1.25rem 3rem; border-radius: 50px; box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3); transition: 0.3s; }
        .luxe-btn-main:hover { transform: scale(1.05); box-shadow: 0 15px 40px var(--red); }

        #player-overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 5000; }
        #ad-shield { position: absolute; inset: 0; z-index: 6000; background: rgba(0,0,0,0.98); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .active-season { background: var(--gold) !important; color: black !important; border-color: var(--gold) !important; }
    </style>
</head>
<body id="swipe-area">

    <div id="loader"><div class="loader-medusa"></div><p class="text-gold mt-6 tracking-[0.5em] font-bold">ZonHD CINEMA</p></div>

    <div id="side-menu" class="p-8 no-scrollbar overflow-y-auto">
        <h2 class="text-gold font-bold mb-8 italic border-b border-red-900 pb-2 uppercase tracking-tighter">Networks</h2>
        <div class="flex flex-col gap-6 text-zinc-400 font-bold uppercase text-xs tracking-widest">
            <button onclick="setFilter('network', 213)">Netflix</button>
            <button onclick="setFilter('network', 2739)">Disney+</button>
            <button onclick="setFilter('network', 453)">Hulu</button>
            <button onclick="setFilter('network', 34)">Adult Swim</button>
            <button onclick="setFilter('network', 19)">Nickelodeon</button>
            <button onclick="setFilter('network', 56)">Cartoon Network</button>
        </div>
    </div>

    <header class="hero-banner"><h1 class="zonhd-logo">ZonHD</h1><p class="text-gold tracking-[0.8em] text-[10px] font-bold">CINEMA LUXE</p></header>

    <div class="sticky top-0 z-[1000] bg-black/95 border-b border-zinc-900">
        <input type="text" id="search-input" class="w-[90%] mx-auto block bg-white/5 border border-gold/20 rounded-full py-2 px-6 my-4 text-white outline-none focus:border-gold" placeholder="Search Master Library..." onkeyup="handleSearch(event)">
        <nav class="flex p-4 gap-8 overflow-x-auto no-scrollbar items-center">
            <button onclick="toggleMenu()" class="text-gold text-2xl">☰</button>
            <button onclick="setFilter('trending')" class="text-red-600 font-black">TRENDING</button>
            <button onclick="setFilter('genre', 27)" class="font-bold">HORROR</button>
            <button onclick="setFilter('genre', 28)" class="font-bold">ACTION</button>
            <button onclick="setFilter('genre', 16)" class="font-bold">ANIME</button>
        </nav>
    </div>

    <div id="continue-section" class="p-4 hidden">
        <h3 class="text-gold font-bold italic mb-4 text-xs tracking-widest uppercase">Continue Watching</h3>
        <div id="continue-grid" class="flex gap-4 overflow-x-auto no-scrollbar"></div>
    </div>

    <main id="movie-grid" class="p-4 grid grid-cols-2 md:grid-cols-5 gap-4"></main>

    <div id="selector-overlay">
        <div id="details-backdrop"></div>
        <div class="relative max-w-6xl mx-auto p-6 md:p-12 min-h-screen">
            <button onclick="closeSelector()" class="bg-white/5 text-gold border border-gold/30 px-6 py-2 rounded-full mb-12 font-bold text-xs hover:bg-gold hover:text-black transition-all">✕ BACK TO LIBRARY</button>
            
            <div class="flex flex-col md:flex-row gap-12 items-center md:items-start mb-16">
                <img id="details-poster" class="w-72 rounded-2xl shadow-[0_0_80px_rgba(212,175,55,0.2)] border border-white/10" src="">
                <div class="flex-1 text-center md:text-left">
                    <h2 id="show-title" class="text-5xl md:text-7xl font-black text-white mb-6 italic tracking-tighter leading-tight font-serif"></h2>
                    <div class="flex flex-wrap gap-4 mb-8 justify-center md:justify-start">
                        <span id="show-rating" class="bg-gold text-black px-4 py-1 rounded-full font-black text-sm"></span>
                        <span id="show-status" class="border border-white/20 px-4 py-1 rounded-full text-zinc-400 text-sm"></span>
                    </div>
                    <p id="show-desc" class="text-zinc-300 text-lg max-w-2xl leading-relaxed mb-10"></p>
                    
                    <div id="movie-action-area" class="hidden">
                        <button onclick="playDirectly()" class="luxe-btn-main uppercase">Watch Film Now</button>
                    </div>
                </div>
            </div>

            <div id="tv-action-area" class="hidden border-t border-white/10 pt-10">
                <h3 class="text-gold font-bold text-[10px] tracking-[0.4em] mb-6 uppercase">Select Season</h3>
                <div id="season-buttons" class="flex gap-4 overflow-x-auto pb-8 no-scrollbar"></div>
                
                <h3 class="text-gold font-bold text-[10px] tracking-[0.4em] mt-8 mb-6 uppercase">Episodes</h3>
                <div id="episode-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 pb-20"></div>
            </div>
        </div>
    </div>

    <div id="player-overlay">
        <div id="ad-shield" onclick="unlockCinema()" tabindex="0">
            <div class="loader-medusa" style="width:100px; height:100px; margin-bottom:20px;"></div>
            <div class="bg-red-700 text-white px-10 py-4 rounded-full font-bold shadow-2xl animate-bounce uppercase">Start Stream (Unmuted)</div>
        </div>
        <div class="flex justify-between p-6 absolute top-0 w-full z-[7000]">
            <button id="close-btn" onclick="closePlayer()" class="bg-black/80 text-white px-6 py-2 rounded-full font-bold text-xs border border-white/20 hover:bg-red-700">✕ CLOSE</button>
        </div>
        <div id="player-container" class="w-full h-full"></div>
    </div>

    <script>
        const API_KEY = 'b9c746781e1e9b084c4cc4f0420156d4';
        let page = 1, activeType = 'trending', activeID = '', currentStreamUrl = '', currentMediaContext = {};

        async function fetchContent(append = false) {
            let url = `https://api.themoviedb.org/3/trending/all/day?api_key=${API_KEY}&page=${page}`;
            if (activeType === 'genre') url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=${activeID}&page=${page}`;
            if (activeType === 'network') url = `https://api.themoviedb.org/3/discover/tv?api_key=${API_KEY}&with_networks=${activeID}&page=${page}`;
            if (activeType === 'search') url = `https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${activeID}&page=${page}`;

            const res = await fetch(url);
            const data = await res.json();
            const grid = document.getElementById('movie-grid');
            if (!append) grid.innerHTML = '';
            
            data.results.forEach(m => {
                if (!m.poster_path) return;
                let type = m.media_type || (m.first_air_date ? 'tv' : 'movie');
                const card = document.createElement('div');
                card.className = "movie-card";
                card.setAttribute('tabindex', '0');
                card.onclick = () => openDetails(m.id, type);
                card.innerHTML = `<img src="https://image.tmdb.org/t/p/w500${m.poster_path}" class="w-full h-full object-cover">`;
                grid.appendChild(card);
            });
        }

        async function openDetails(id, type) {
            const res = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}`);
            const data = await res.json();
            
            currentMediaContext = { id, type, poster: data.poster_path };
            
            document.getElementById('show-title').innerText = data.name || data.title;
            document.getElementById('show-desc').innerText = data.overview;
            document.getElementById('show-status').innerText = (data.release_date || data.first_air_date || '').split('-')[0];
            document.getElementById('show-rating').innerText = `★ ${data.vote_average.toFixed(1)}`;
            document.getElementById('details-poster').src = `https://image.tmdb.org/t/p/w500${data.poster_path}`;
            document.getElementById('details-backdrop').style.backgroundImage = `url(https://image.tmdb.org/t/p/original${data.backdrop_path})`;
            
            const movieArea = document.getElementById('movie-action-area');
            const tvArea = document.getElementById('tv-action-area');

            if (type === 'movie') {
                movieArea.classList.remove('hidden');
                tvArea.classList.add('hidden');
                currentStreamUrl = `https://vidlink.pro/movie/${id}?autoplay=true`;
            } else {
                movieArea.classList.add('hidden');
                tvArea.classList.remove('hidden');
                renderSeasons(data);
            }

            document.getElementById('selector-overlay').style.display = 'block';
            window.scrollTo(0,0);
        }

        function renderSeasons(data) {
            const container = document.getElementById('season-buttons');
            container.innerHTML = '';
            data.seasons.forEach(s => {
                if (s.season_number === 0) return;
                const btn = document.createElement('button');
                btn.className = "px-8 py-3 bg-zinc-900 rounded-xl text-[10px] font-bold uppercase border border-white/5 transition-all";
                btn.innerText = `Season ${s.season_number}`;
                btn.onclick = () => {
                    document.querySelectorAll('#season-buttons button').forEach(b => b.classList.remove('active-season'));
                    btn.classList.add('active-season');
                    loadEpisodes(data.id, s.season_number);
                };
                container.appendChild(btn);
            });
            if(container.firstChild) container.firstChild.click();
        }

        async function loadEpisodes(showId, seasonNum) {
            const res = await fetch(`https://api.themoviedb.org/3/tv/${showId}/season/${seasonNum}?api_key=${API_KEY}`);
            const data = await res.json();
            const grid = document.getElementById('episode-grid');
            grid.innerHTML = '';
            data.episodes.forEach(e => {
                const ep = document.createElement('div');
                ep.className = "bg-white/5 p-5 rounded-2xl border border-white/5 hover:border-gold/50 cursor-pointer transition-all flex items-center gap-6 group";
                ep.innerHTML = `<div class="text-gold font-black text-2xl">${e.episode_number}</div>
                                <div class="text-left"><p class="text-white font-bold text-sm">${e.name}</p></div>`;
                ep.onclick = () => {
                    currentStreamUrl = `https://vidlink.pro/tv/${showId}/${seasonNum}/${e.episode_number}?autoplay=true`;
                    currentMediaContext.s = seasonNum;
                    currentMediaContext.e = e.episode_number;
                    startPlayer();
                };
                grid.appendChild(ep);
            });
        }

        function playDirectly() { startPlayer(); }

        function startPlayer() {
            document.getElementById('selector-overlay').style.display = 'none';
            document.getElementById('player-overlay').style.display = 'block';
            document.getElementById('ad-shield').style.display = 'flex';
        }

        function unlockCinema() {
            const shield = document.getElementById('ad-shield');
            const container = document.getElementById('player-container');
            const { id, type, poster, s, e } = currentMediaContext;

            let history = JSON.parse(localStorage.getItem('zonhd_history') || '[]');
            history = history.filter(item => item.id !== id);
            history.unshift({ id, type, poster, s: s||1, e: e||1 });
            localStorage.setItem('zonhd_history', JSON.stringify(history.slice(0, 10)));
            
            container.innerHTML = `<iframe src="${currentStreamUrl}" allow="autoplay; fullscreen" allowfullscreen class="w-full h-full border-none"></iframe>`;
            setTimeout(() => { shield.style.display = 'none'; }, 2000);
        }

        function closeSelector() { document.getElementById('selector-overlay').style.display = 'none'; }
        function closePlayer() { document.getElementById('player-overlay').style.display = 'none'; document.getElementById('player-container').innerHTML = ''; }
        function toggleMenu() { document.getElementById('side-menu').classList.toggle('menu-open'); }
        function setFilter(type, id = '') { activeType = type; activeID = id; page = 1; document.getElementById('side-menu').classList.remove('menu-open'); fetchContent(); }
        function handleSearch(e) { if (e.key === 'Enter') { activeType = 'search'; activeID = e.target.value; page = 1; fetchContent(); } }

        window.onload = () => { setTimeout(() => { document.getElementById('loader').style.opacity = '0'; setTimeout(() => document.getElementById('loader').remove(), 600); }, 1500); fetchContent(); };
    </script>
</body>
</html>
