<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>ZonHD Cinema</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,900;1,900&family=Inter:wght@300;700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #D4AF37; --red: #FF0000; --black: #050505; --dark-gray: #121212; }
        body { background: var(--black); color: white; font-family: 'Inter', sans-serif; overflow-x: hidden; margin: 0; }
        
        /* EXTRAVAGANT MEDUSA BANNER */
        .hero-banner {
            height: 85vh;
            position: relative;
            background: linear-gradient(to bottom, transparent 20%, rgba(5,5,5,0.8) 70%, var(--black) 100%), 
                        url('IMG_8035.jpeg');
            background-size: cover; background-position: center 10%;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
            padding-bottom: 80px;
        }

        /* GLOWING RED EYES ANIMATION */
        .medusa-eyes {
            position: absolute; top: 35%; width: 100%; height: 20px;
            background: radial-gradient(circle, rgba(255,0,0,0.8) 0%, transparent 60%);
            filter: blur(5px); animation: eyeGlow 2s infinite alternate ease-in-out;
            pointer-events: none;
        }
        @keyframes eyeGlow { from { opacity: 0.2; transform: scale(0.9); } to { opacity: 1; transform: scale(1.1); } }

        .zonhd-logo {
            font-family: 'Playfair Display', serif; font-size: clamp(4rem, 18vw, 8rem);
            font-weight: 900; color: var(--gold); text-shadow: 0 0 30px var(--red);
            letter-spacing: -4px; font-style: italic; line-height: 0.8;
        }

        /* SIDE MENU LUXE */
        #side-menu {
            position: fixed; top: 0; left: 0; bottom: 0; width: 280px;
            background: linear-gradient(135deg, #0a0a0a 0%, #000 100%);
            border-right: 1px solid var(--gold); z-index: 3000;
            transform: translateX(-100%); transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .menu-open { transform: translateX(0) !important; }

        /* MOVIE CARDS */
        .movie-card { 
            position: relative; aspect-ratio: 2/3; border-radius: 8px; 
            overflow: hidden; transition: 0.5s; cursor: pointer;
            border: 1px solid rgba(212, 175, 55, 0.1);
        }
        .movie-card:active { transform: scale(0.95); }
        .medusa-play-btn {
            position: absolute; inset: 0; background: rgba(0,0,0,0.4) url('IMG_8035.jpeg');
            background-size: cover; background-position: center; border-radius: 50%;
            width: 60px; height: 60px; top: 50%; left: 50%; transform: translate(-50%, -50%);
            border: 2px solid var(--gold); opacity: 0; transition: 0.3s;
        }
        .movie-card:hover .medusa-play-btn { opacity: 1; }

        /* PLAYER OVERLAY */
        #player-overlay { 
            display: none; position: fixed; inset: 0; background: #000; z-index: 5000; 
            padding-top: env(safe-area-inset-top);
        }
        iframe { width: 100%; height: 100%; border: none; }
        
        .search-bar {
            background: rgba(255,255,255,0.1); border: 1px solid var(--gold);
            border-radius: 50px; padding: 10px 20px; color: white; width: 80%;
            margin: 20px auto; display: block; outline: none;
        }
    </style>
</head>
<body id="swipe-area">

    <div id="side-menu" class="p-6">
        <h2 class="text-gold text-xl font-bold mb-8 tracking-tighter italic border-b border-red-900 pb-2">NETWORKS</h2>
        <div class="flex flex-col gap-5 text-zinc-400 font-semibold uppercase text-xs tracking-widest">
            <button onclick="setFilter('network', 213)">Netflix</button>
            <button onclick="setFilter('network', 2739)">Disney+</button>
            <button onclick="setFilter('network', 43)">HBO</button>
            <button onclick="setFilter('network', 34)">Adult Swim</button>
            <button onclick="setFilter('network', 19)">Nickelodeon</button>
            <button onclick="setFilter('network', 56)">Cartoon Network</button>
        </div>
    </div>

    <header class="hero-banner">
        <div class="medusa-eyes"></div>
        <h1 class="zonhd-logo">ZonHD</h1>
        <p class="text-gold tracking-[1em] text-[10px] font-bold mt-4 uppercase">The Medusa Standard</p>
    </header>

    <div class="sticky top-0 z-[1000] bg-black/90 backdrop-blur-md">
        <input type="text" id="search-input" class="search-bar" placeholder="Search Movies or TV Shows..." onkeyup="handleSearch(event)">
        <nav class="flex p-4 gap-6 overflow-x-auto no-scrollbar border-b border-zinc-900 items-center">
            <button onclick="toggleMenu()" class="text-gold text-2xl pr-2">☰</button>
            <button onclick="setFilter('trending')" class="text-red-600 font-bold whitespace-nowrap">TRENDING</button>
            <button onclick="setFilter('genre', 27)" class="whitespace-nowrap hover:text-gold transition">HORROR</button>
            <button onclick="setFilter('genre', 28)" class="whitespace-nowrap hover:text-gold transition">ACTION</button>
            <button onclick="setFilter('genre', 16)" class="whitespace-nowrap hover:text-gold transition">ANIME</button>
            <button onclick="setFilter('genre', 10751)" class="whitespace-nowrap hover:text-gold transition">FAMILY</button>
        </nav>
    </div>

    <main id="movie-grid" class="p-3 grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3"></main>

    <div id="player-overlay">
        <div class="flex justify-between items-center p-4 absolute top-0 w-full z-[6000]">
            <button onclick="closePlayer()" class="bg-red-600 text-white px-4 py-2 rounded-full font-bold">CLOSE</button>
            <span class="text-gold font-bold italic">ZonHD CINEMA</span>
        </div>
        <div id="player-container" class="w-full h-full"></div>
    </div>

 <script>
    const API_KEY = 'b9c746781e1e9b084c4cc4f0420156d4';
    let page = 1;
    let activeType = 'trending';
    let activeID = '';
    let isFetching = false;

    // Mobile Swipe Logic
    const mc = new Hammer(document.getElementById('swipe-area'));
    mc.on("swiperight", () => document.getElementById('side-menu').classList.add('menu-open'));
    mc.on("swipeleft", () => document.getElementById('side-menu').classList.remove('menu-open'));

    async function fetchContent(append = false) {
        if (isFetching) return;
        isFetching = true;
        
        let url = `https://api.themoviedb.org/3/trending/all/day?api_key=${API_KEY}&page=${page}`;
        if (activeType === 'genre') url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=${activeID}&page=${page}&sort_by=popularity.desc`;
        if (activeType === 'network') url = `https://api.themoviedb.org/3/discover/tv?api_key=${API_KEY}&with_networks=${activeID}&page=${page}`;
        if (activeType === 'search') url = `https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${activeID}&page=${page}`;

        try {
            const res = await fetch(url);
            const data = await res.json();
            renderMovies(data.results, append);
        } catch (e) { console.error("Load failed"); }
        isFetching = false;
    }

    function renderMovies(movies, append) {
        const grid = document.getElementById('movie-grid');
        if (!append) grid.innerHTML = '';
        
        movies.forEach(m => {
            if (!m.poster_path) return;
            const card = document.createElement('div');
            card.className = "movie-card";
            // This calls the playMovie function below
            card.onclick = () => playMovie(m.id, m.media_type || (activeType === 'network' ? 'tv' : 'movie'));
            card.innerHTML = `
                <img src="https://image.tmdb.org/t/p/w500${m.poster_path}" class="w-full h-full object-cover">
                <div class="medusa-play-btn"></div>
            `;
            grid.appendChild(card);
        });
    }

    // THE PLAYER FUNCTION YOU WERE LOOKING FOR
    function playMovie(id, type) {
        const container = document.getElementById('player-container');
        
        // We use VidLink but we've relaxed the sandbox so it doesn't give that error
        const source = `https://vidlink.pro/${type}/${id}?autoplay=true&primaryColor=D4AF37`;
        
        container.innerHTML = `
            <iframe 
                src="${source}" 
                allow="autoplay; fullscreen; picture-in-picture; encrypted-media" 
                allowfullscreen 
                sandbox="allow-forms allow-pointer-lock allow-same-origin allow-scripts allow-top-navigation allow-modals">
            </iframe>`;
        
        document.getElementById('player-overlay').style.display = 'block';
    }

    function handleSearch(e) {
        if (e.key === 'Enter') {
            activeType = 'search';
            activeID = e.target.value;
            page = 1;
            fetchContent();
        }
    }

    function setFilter(type, id = '') {
        activeType = type; activeID = id; page = 1;
        document.getElementById('side-menu').classList.remove('menu-open');
        window.scrollTo(0,0);
        fetchContent();
    }

    function toggleMenu() { document.getElementById('side-menu').classList.toggle('menu-open'); }
    
    function closePlayer() { 
        document.getElementById('player-overlay').style.display = 'none';
        document.getElementById('player-container').innerHTML = ''; 
    }

    window.onscroll = () => {
        if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 1500) {
            page++;
            fetchContent(true);
        }
    };

    fetchContent();
</script>
</body>
</html>
