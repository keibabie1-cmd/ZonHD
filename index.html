<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ZonHD Cinema Luxe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,900;1,900&family=Inter:wght@300;400;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #D4AF37; --red: #E50914; --black: #050505; }
        body { background: var(--black); color: white; font-family: 'Inter', sans-serif; margin: 0; padding: 0; overflow-x: hidden; touch-action: pan-y; -webkit-tap-highlight-color: transparent; }
        #loader { position: fixed; inset: 0; background: var(--black); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s ease; }
        .loader-medusa { width: 120px; height: 120px; border-radius: 50%; background: url('IMG_8035.jpeg'); background-size: cover; border: 3px solid var(--gold); box-shadow: 0 0 40px var(--red); animation: pulse 2s infinite ease-in-out; }
        @keyframes pulse { 0%, 100% { transform: scale(0.95); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 1; } }
        #side-menu { position: fixed; top: 0; left: 0; bottom: 0; width: 280px; background: #000; border-right: 1px solid var(--gold); z-index: 3000; transform: translateX(-100%); transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .menu-open { transform: translateX(0) !important; }
        .hero-banner { height: 45vh; position: relative; background: linear-gradient(to bottom, transparent, var(--black)), url('IMG_8035.jpeg'); background-size: cover; background-position: center; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 20px; }
        .zonhd-logo { font-family: 'Playfair Display', serif; font-size: clamp(3rem, 10vw, 5rem); color: var(--gold); text-shadow: 0 0 20px var(--red); font-style: italic; }
        .movie-card { aspect-ratio: 2/3; border-radius: 8px; overflow: hidden; cursor: pointer; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); border: 2px solid transparent; }
        .focusable:focus { outline: none; border-color: var(--gold) !important; transform: scale(1.05); box-shadow: 0 0 20px rgba(212, 175, 55, 0.4); z-index: 50; }
        #selector-overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 4000; overflow-y: auto; }
        #details-backdrop { position: absolute; top: 0; width: 100%; height: 100%; opacity: 0.35; background-size: cover; background-position: center; filter: blur(40px); pointer-events: none; }
        .rating-badge { border: 1.5px solid var(--gold); color: var(--gold); padding: 1px 6px; border-radius: 4px; font-weight: 800; font-size: 13px; }
        .btn-play-red { background: var(--red); color: white; font-weight: 800; padding: 16px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; max-width: 450px; margin: 20px 0; border: none; transition: 0.2s; box-shadow: 0 4px 15px rgba(229, 9, 20, 0.3); }
        .episode-row { display: flex; gap: 15px; padding: 15px; border-radius: 8px; margin-bottom: 8px; background: rgba(255,255,255,0.03); cursor: pointer; border: 2px solid transparent; }
        #player-overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 5000; }
        #luxe-player { width: 100%; height: 100%; border: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="loader"><div class="loader-medusa"></div><p class="text-gold mt-6 tracking-[0.5em] font-bold uppercase">ZonHD Cinema</p></div>
    
    <div id="side-menu" class="p-8 no-scrollbar overflow-y-auto">
        <h2 class="text-gold font-bold mb-8 italic border-b border-red-900 pb-2 uppercase tracking-tighter">Networks</h2>
        <div id="nav-networks" class="flex flex-col gap-6 text-zinc-400 font-bold uppercase text-xs tracking-widest">
            <button class="focusable text-left" onclick="setFilter('network', 213)">Netflix</button>
            <button class="focusable text-left" onclick="setFilter('network', 453)">Hulu</button>
            <button class="focusable text-left" onclick="setFilter('network', 2739)">Disney+</button>
            <button class="focusable text-left" onclick="setFilter('network', 19)">Nickelodeon</button>
            <button class="focusable text-left" onclick="setFilter('network', 243)">Boomerang</button>
            <button class="focusable text-left" onclick="setFilter('network', 34)">Adult Swim</button>
            <button class="focusable text-left" onclick="setFilter('network', 56)">Cartoon Network</button>
            <button class="focusable text-left" onclick="setFilter('network', 77)">SyFy</button>
        </div>
    </div>

    <header class="hero-banner"><h1 class="zonhd-logo">ZonHD</h1><p class="text-gold tracking-[0.8em] text-[10px] font-bold uppercase">Cinema Luxe</p></header>
    
    <div class="sticky top-0 z-[1000] bg-black/95 border-b border-zinc-900 px-4">
        <input type="search" id="search-input" class="focusable w-full bg-white/5 border border-gold/20 rounded-full py-2.5 px-6 my-4 text-white outline-none" placeholder="Search Master Library..." onkeyup="handleSearch(event)">
        <nav id="nav-main" class="flex pb-4 gap-8 overflow-x-auto no-scrollbar items-center text-[10px] font-bold tracking-widest uppercase">
            <button id="menu-btn" onclick="toggleMenu()" class="focusable text-gold text-2xl pr-2">☰</button>
            <button id="btn-trending" onclick="setFilter('trending')" class="focusable whitespace-nowrap">Trending</button>
            <button class="focusable whitespace-nowrap" onclick="setFilter('genre', 27)">Horror</button>
            <button class="focusable whitespace-nowrap" onclick="setFilter('genre', 28)">Action</button>
            <button class="focusable whitespace-nowrap" onclick="setFilter('genre', 16)">Anime</button>
        </nav>
    </div>

    <main id="movie-grid" class="p-4 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 lg:grid-cols-6 gap-4"></main>

    <div id="selector-overlay" class="no-scrollbar">
        <div id="details-backdrop"></div>
        <div class="relative z-10 p-6 pt-10 max-w-4xl mx-auto">
            <button onclick="closeSelector()" class="focusable mb-6 bg-black/50 p-2 rounded-full border border-white/10">
                <svg width="24" height="24" fill="white" viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
            </button>
            <div class="flex gap-6 mb-8">
                <img id="details-poster" class="w-32 sm:w-48 rounded-lg shadow-2xl border border-white/10">
                <div class="flex flex-col justify-end">
                    <h2 id="show-title" class="text-3xl sm:text-5xl font-extrabold mb-3 tracking-tighter"></h2>
                    <div class="flex items-center gap-4">
                        <span id="show-year" class="text-zinc-400 font-bold"></span>
                        <span id="show-rating" class="rating-badge"></span>
                    </div>
                </div>
            </div>
            
            <div id="movie-action-area" class="hidden">
                <button onclick="startLuxeStream()" class="focusable btn-play-red">▶ WATCH NOW</button>
            </div>
            
            <div id="tv-action-area" class="hidden">
                <h3 class="text-lg font-bold mb-4 border-b border-zinc-800 pb-2 text-gold uppercase tracking-widest">Episodes</h3>
                <div id="season-buttons" class="flex gap-3 overflow-x-auto no-scrollbar mb-6"></div>
                <div id="episode-grid"></div>
            </div>
            
            <p id="show-desc" class="text-zinc-400 text-sm leading-relaxed mt-6 max-w-2xl"></p>
        </div>
    </div>

    <div id="player-overlay">
        <div class="absolute top-4 left-4 z-[7000]">
            <button onclick="closePlayer()" class="focusable bg-black/80 text-white px-6 py-3 rounded-full border border-white/20 font-bold text-xs">✕ EXIT CINEMA</button>
        </div>
        <iframe id="luxe-player" allowfullscreen allow="autoplay; fullscreen" referrerpolicy="no-referrer"></iframe>
    </div>

    <script>
        let API_KEY = '', activeType = 'trending', activeID = '', currentMedia = {};
        let currentPage = 1, isLoading = false;

        async function fetchConfig() {
            try {
                const res = await fetch('/api/config');
                const data = await res.json();
                API_KEY = data.tmdb_key;
                fetchContent();
            } catch (err) { console.error("Config missing"); }
        }

        async function fetchContent(append = false) {
            if (isLoading || !API_KEY) return;
            isLoading = true;
            if (!append) { currentPage = 1; document.getElementById('movie-grid').innerHTML = ''; }
            
            let url = `https://api.themoviedb.org/3/trending/all/day?api_key=${API_KEY}&page=${currentPage}`;
            if (activeType === 'genre') url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=${activeID}&page=${currentPage}`;
            if (activeType === 'network') url = `https://api.themoviedb.org/3/discover/tv?api_key=${API_KEY}&with_networks=${activeID}&page=${currentPage}`;
            if (activeType === 'search') url = `https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${activeID}&page=${currentPage}`;

            const res = await fetch(url);
            const data = await res.json();
            renderGrid(data.results);
            isLoading = false;
        }

        function renderGrid(results) {
            const grid = document.getElementById('movie-grid');
            results.forEach(m => {
                if (!m.poster_path) return;
                const card = document.createElement('div');
                card.className = "movie-card focusable"; card.tabIndex = 0;
                card.onclick = () => openDetails(m.id, m.media_type || (m.first_air_date ? 'tv' : 'movie'));
                card.innerHTML = `<img src="https://image.tmdb.org/t/p/w500${m.poster_path}" class="w-full h-full object-cover">`;
                grid.appendChild(card);
            });
        }

        async function openDetails(id, type) {
            const res = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}`);
            const data = await res.json();
            currentMedia = { id, type, s: 1, e: 1, title: data.name || data.title };
            
            document.getElementById('show-title').innerText = currentMedia.title;
            document.getElementById('show-desc').innerText = data.overview;
            document.getElementById('show-year').innerText = (data.release_date || data.first_air_date || '').split('-')[0];
            document.getElementById('show-rating').innerText = `★ ${data.vote_average.toFixed(1)}`;
            document.getElementById('details-poster').src = `https://image.tmdb.org/t/p/w500${data.poster_path}`;
            document.getElementById('details-backdrop').style.backgroundImage = `url(https://image.tmdb.org/t/p/original${data.backdrop_path})`;
            
            document.getElementById('movie-action-area').classList.toggle('hidden', type !== 'movie');
            document.getElementById('tv-action-area').classList.toggle('hidden', type !== 'tv');
            
            if (type === 'tv') renderSeasons(data);
            document.getElementById('selector-overlay').style.display = 'block';
        }

        function renderSeasons(data) {
            const container = document.getElementById('season-buttons');
            container.innerHTML = '';
            data.seasons.forEach(s => {
                if (s.season_number === 0) return;
                const btn = document.createElement('button');
                btn.className = "focusable px-6 py-2 bg-zinc-900 rounded-lg text-xs font-bold border border-white/5";
                btn.innerText = `Season ${s.season_number}`;
                btn.onclick = () => loadEpisodes(data.id, s.season_number);
                container.appendChild(btn);
            });
            if(container.firstChild) container.firstChild.click();
        }

        async function loadEpisodes(showId, seasonNum) {
            const res = await fetch(`https://api.themoviedb.org/3/tv/${showId}/season/${seasonNum}?api_key=${API_KEY}`);
            const data = await res.json();
            const grid = document.getElementById('episode-grid');
            grid.innerHTML = '';
            data.episodes.forEach(e => {
                const row = document.createElement('div');
                row.className = "episode-row focusable"; row.tabIndex = 0;
                row.onclick = () => { currentMedia.s = seasonNum; currentMedia.e = e.episode_number; startLuxeStream(); };
                row.innerHTML = `<div class="text-white font-bold text-sm">E${e.episode_number} - ${e.name}</div>`;
                grid.appendChild(row);
            });
        }

        function startLuxeStream() {
            const { type, id, s, e } = currentMedia;
            const player = document.getElementById('luxe-player');
            
            // 2026 Mobile & TV Cross-Platform Optimized Bridge
            // This source automatically handles mobile sandboxing and offers English CC by default.
            const baseUrl = type === 'movie' ? 
                `https://vidsrc.cc/v2/embed/movie/${id}` : 
                `https://vidsrc.cc/v2/embed/tv/${id}/${s}/${e}`;

            player.src = baseUrl;
            document.getElementById('player-overlay').style.display = 'block';
        }

        function closeSelector() { document.getElementById('selector-overlay').style.display = 'none'; }
        function closePlayer() { document.getElementById('luxe-player').src = ""; document.getElementById('player-overlay').style.display = 'none'; }
        function toggleMenu() { document.getElementById('side-menu').classList.toggle('menu-open'); }
        function handleSearch(e) { if (e.key === 'Enter') { setFilter('search', e.target.value); e.target.blur(); } }
        function setFilter(type, id = '') { activeType = type; activeID = id; fetchContent(); toggleMenu(); }

        window.onload = () => { 
            setTimeout(() => { document.getElementById('loader').style.opacity = '0'; setTimeout(() => document.getElementById('loader').remove(), 500); }, 1000);
            fetchConfig(); 
        };
    </script>
</body>
</html>
