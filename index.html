<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>ZonHD Cinema</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --gold: #D4AF37; --red: #FF0000; --black: #050505; }
        body { background: var(--black); color: white; font-family: 'Playfair Display', serif; overflow-x: hidden; }
        
        /* THE MEDUSA BANNER */
        .hero-banner {
            height: 65vh;
            background: linear-gradient(to bottom, transparent 30%, var(--black) 100%), 
                        url('https://images.mirror-media.xyz/publication-images/7gB_rQpW3ZlX7u_7p_q-x.png?height=1024&width=1024'); /* Replace with your Black Medusa Image */
            background-size: cover; background-position: center;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
            padding-bottom: 40px; border-bottom: 2px solid var(--gold);
        }

        .zonhd-logo {
            font-size: 5rem; font-weight: 900; color: var(--red);
            text-shadow: 0 0 20px var(--red), 0 0 40px var(--gold);
            letter-spacing: -2px; font-style: italic;
        }

        /* SWIPE MENU */
        #side-menu {
            position: fixed; top: 0; left: 0; bottom: 0; width: 280px;
            background: rgba(10, 0, 0, 0.98); border-right: 1px solid var(--gold);
            z-index: 1000; transform: translateX(-100%); transition: 0.3s;
        }
        .menu-open { transform: translateX(0) !important; }

        /* MOVIE CARDS */
        .movie-card { border: 1px solid rgba(212, 175, 55, 0.1); transition: 0.3s; }
        .movie-card:active { transform: scale(0.95); border-color: var(--gold); }
        
        #player-overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 2000; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <div id="side-menu" class="p-8 overflow-y-auto no-scrollbar">
        <h2 class="text-gold text-2xl font-black mb-6 italic">Networks</h2>
        <div class="flex flex-col gap-6 text-sm uppercase tracking-widest font-bold text-zinc-400">
            <button onclick="setFilter('network', 213, 'Netflix')">Netflix</button>
            <button onclick="setFilter('network', 2739, 'Disney+')">Disney+</button>
            <button onclick="setFilter('network', 1024, 'Amazon')">Amazon</button>
            <button onclick="setFilter('network', 43, 'HBO')">HBO</button>
            <button onclick="setFilter('network', 34, 'Adult Swim')">Adult Swim</button>
            <button onclick="setFilter('network', 19, 'Nickelodeon')">Nickelodeon</button>
            <button onclick="setFilter('network', 56, 'Cartoon Network')">Cartoon Network</button>
        </div>
    </div>

    <header class="hero-banner">
        <h1 class="zonhd-logo">ZonHD</h1>
        <p class="text-gold tracking-[1em] text-[10px] uppercase font-bold">Cinema Medusa</p>
    </header>

    <nav class="sticky top-0 z-[500] bg-black/95 backdrop-blur-md p-4 flex overflow-x-auto gap-8 no-scrollbar border-b border-zinc-900">
        <button onclick="toggleMenu()" class="text-gold text-2xl">☰</button>
        <button onclick="setFilter('genre', 27, 'Horror')" class="whitespace-nowrap font-bold">Horror</button>
        <button onclick="setFilter('genre', 28, 'Action')" class="whitespace-nowrap font-bold">Action</button>
        <button onclick="setFilter('genre', 16, 'Anime')" class="whitespace-nowrap font-bold">Anime</button>
        <button onclick="setFilter('genre', 53, 'Thriller')" class="whitespace-nowrap font-bold">Thriller</button>
        <button onclick="setFilter('genre', 14, 'Fantasy')" class="whitespace-nowrap font-bold">Fantasy</button>
        <button onclick="setFilter('genre', 10751, 'Family')" class="whitespace-nowrap font-bold">Family</button>
    </nav>

    <div id="current-label" class="p-4 text-center text-gold uppercase text-[10px] tracking-widest">Trending Now</div>

    <main id="movie-grid" class="p-4 grid grid-cols-2 md:grid-cols-5 gap-4">
        </main>

    <div id="player-overlay">
        <button onclick="closePlayer()" class="absolute top-10 right-10 z-[2100] bg-red-600 p-4 rounded-full font-bold">✕</button>
        <iframe id="video-frame" allow="autoplay; fullscreen" allowfullscreen class="w-full h-full border-none"></iframe>
    </div>

    <script>
        const API_KEY = 'b9c746781e1e9b084c4cc4f0420156d4';
        let page = 1;
        let activeType = 'trending'; 
        let activeID = '';

        // LOAD CONTENT LOGIC
        async function fetchContent(append = false) {
            let url = `https://api.themoviedb.org/3/trending/all/week?api_key=${API_KEY}&page=${page}`;
            
            if (activeType === 'genre') {
                url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=${activeID}&page=${page}`;
            } else if (activeType === 'network') {
                url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_networks=${activeID}&page=${page}`;
            }

            const res = await fetch(url);
            const data = await res.json();
            const grid = document.getElementById('movie-grid');
            if(!append) grid.innerHTML = '';

            data.results.forEach(m => {
                if (!m.poster_path) return;
                const card = document.createElement('div');
                card.className = "movie-card bg-zinc-900 rounded-xl overflow-hidden";
                card.onclick = () => {
                    document.getElementById('video-frame').src = `https://vidsrc.me/embed/${m.media_type || 'movie'}?tmdb=${m.id}&autoplay=1`;
                    document.getElementById('player-overlay').style.display = 'block';
                };
                card.innerHTML = `<img src="https://image.tmdb.org/t/p/w500${m.poster_path}" class="w-full">`;
                grid.appendChild(card);
            });
        }

        // FILTER SWITCHER
        function setFilter(type, id, label) {
            activeType = type;
            activeID = id;
            page = 1;
            document.getElementById('current-label').innerText = label;
            document.getElementById('side-menu').classList.remove('menu-open');
            fetchContent();
        }

        function toggleMenu() { document.getElementById('side-menu').classList.toggle('menu-open'); }
        function closePlayer() { document.getElementById('player-overlay').style.display = 'none'; document.getElementById('video-frame').src = ''; }

        // INFINITE SCROLL
        window.onscroll = () => {
            if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 1200) {
                page++; fetchContent(true);
            }
        };

        fetchContent();
    </script>
</body>
</html>
